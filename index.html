<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>班級座號轉盤</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {

  padding: 10px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f6f2ea;

  color: #39342e;
}


/* =========================
   整體
========================= */

.app {

  width: 100%;

  height: calc(100vh - 20px);

  max-width: 1500px;

  display: grid;

  grid-template-columns:
    minmax(0, 1.55fr)
    minmax(340px, .65fr);

  gap: 12px;
}


.panel {

  background: #ffffff;

  border: 1px solid #ded7cc;

  border-radius: 20px;

  box-shadow:
    0 6px 20px
    rgba(0,0,0,.05);
}


/* =========================
   左側
========================= */

.main-panel {

  position: relative;

  height: 100%;

  padding: 14px 18px 10px;

  display: flex;

  flex-direction: column;

  align-items: center;

  text-align: center;

  min-height: 0;
}


.title {

  font-size: 30px;

  font-weight: 900;

  margin-bottom: 2px;
}


.subtitle {

  color: #81796d;

  font-size: 14px;

  margin-bottom: 4px;
}


/* =========================
   轉盤
========================= */

.wheel-wrap {

  flex: 1;

  width: 100%;

  display: flex;

  justify-content: center;

  align-items: center;

  min-height: 0;
}


.wheel-area {

  position: relative;

  width: min(
    72vh,
    690px
  );

  aspect-ratio: 1;
}


.wheel-shadow {

  position: absolute;

  inset: 4%;

  border-radius: 50%;

  box-shadow:
    0 16px 32px
    rgba(0,0,0,.16);
}


#wheel {

  width: 100%;

  height: 100%;

  display: block;

  transform: rotate(0deg);
}


/* =========================
   箭頭
========================= */

.pointer {

  position: absolute;

  left: 50%;

  top: -2px;

  transform: translateX(-50%);

  width: 0;

  height: 0;

  border-left:
    25px solid transparent;

  border-right:
    25px solid transparent;

  border-top:
    52px solid #50483e;

  z-index: 30;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.22)
    );
}


/* =========================
   GO
========================= */

.go-button {

  position: absolute;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 105px;

  height: 105px;

  border-radius: 50%;

  border:
    8px solid #5f564b;

  background: #fffaf2;

  color: #4a433a;

  font-size: 28px;

  font-weight: 900;

  cursor: pointer;

  z-index: 20;

  box-shadow:
    0 6px 18px
    rgba(0,0,0,.2);

  transition:
    transform .15s ease,
    background .15s ease;
}


.go-button:hover {

  transform:
    translate(-50%, -50%)
    scale(1.06);

  background:
    #f1e8db;
}


.go-button:active {

  transform:
    translate(-50%, -50%)
    scale(.94);
}


.go-button:disabled {

  opacity: .55;

  cursor: not-allowed;

  transform:
    translate(-50%, -50%);
}


.go-button.spinning {

  animation:
    pulse 1s
    infinite alternate;
}


@keyframes pulse {

  from {
    box-shadow:
      0 5px 14px
      rgba(0,0,0,.16);
  }

  to {
    box-shadow:
      0 8px 28px
      rgba(92,76,57,.38);
  }
}


/* =========================
   左下狀態
========================= */

.bottom-status {

  margin-top: 2px;

  min-height: 28px;

  color: #71695f;

  font-size: 14px;

  font-weight: 800;
}


.hint {

  color: #aaa197;

  font-size: 11px;
}


/* =========================
   右側
========================= */

.side {

  height: 100%;

  display: grid;

  grid-template-rows:
    auto
    auto
    1fr
    1fr
    1fr
    auto;

  gap: 8px;

  min-height: 0;
}


.side-panel {

  padding: 11px 12px;

  min-height: 0;

  overflow: hidden;
}


.section-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  margin-bottom: 7px;

  font-size: 15px;

  font-weight: 900;
}


/* =========================
   抽幾位
========================= */

.draw-settings {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;
}


.draw-settings-label {

  font-size: 16px;

  font-weight: 900;
}


select {

  width: 150px;

  padding: 8px 11px;

  border:
    1px solid #cec5b8;

  border-radius: 9px;

  background: white;

  color: #39342e;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;
}


/* =========================
   數字區塊
========================= */

.number-list {

  display: flex;

  flex-wrap: wrap;

  gap: 5px;
}


.number-chip {

  min-width: 42px;

  padding: 6px 7px;

  border-radius: 8px;

  background: #f1ede5;

  border:
    1px solid #ddd4c7;

  text-align: center;

  font-size: 12px;

  font-weight: 800;
}


.number-chip.drawn {

  background: #e5e2dc;

  color: #99938a;

  text-decoration: line-through;
}


/* =========================
   今日不參與
========================= */

.absence-list {

  display: flex;

  flex-wrap: wrap;

  gap: 5px;
}


.absence-btn {

  min-width: 42px;

  padding: 6px 7px;

  border-radius: 8px;

  border:
    1px solid #d3cabd;

  background: white;

  color: #39342e;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;
}


.absence-btn:hover {

  background: #f3eee5;
}


.absence-btn.excluded {

  background: #d7d2ca;

  color: #77716a;

  text-decoration: line-through;
}


.absence-btn:disabled {

  cursor: not-allowed;
}


/* =========================
   恢復全員
========================= */

.restore-btn {

  padding: 4px 8px;

  border:
    1px solid #cdc3b5;

  border-radius: 7px;

  background: white;

  color: #453f37;

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;
}


.restore-btn:disabled {

  opacity: .4;

  cursor: not-allowed;
}


/* =========================
   本輪抽中
========================= */

.round-list {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;
}


.round-card {

  min-width: 82px;

  padding: 6px 8px;

  border-radius: 10px;

  border:
    1.5px solid #c9baa6;

  background: #eee6da;

  text-align: center;

  animation:
    pop .4s ease;
}


.round-order {

  font-size: 10px;

  color: #82776a;

  font-weight: 800;
}


.round-number {

  font-size: 20px;

  font-weight: 900;
}


.empty-text {

  color: #aaa197;

  font-size: 12px;

  padding-top: 5px;
}


@keyframes pop {

  0% {
    transform: scale(.65);
  }

  70% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }
}


/* =========================
   操作按鈕
========================= */

.actions {

  display: flex;

  gap: 7px;
}


.action-btn {

  flex: 1;

  padding: 10px 6px;

  border:
    1px solid #cdc4b7;

  border-radius: 9px;

  background: white;

  color: #39342e;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;
}


.action-btn:hover {

  background: #f5f1e9;
}


.action-btn:disabled {

  opacity: .4;

  cursor: not-allowed;
}


/* =========================
   小螢幕微調
========================= */

@media (max-height: 760px) {

  .title {
    font-size: 25px;
  }

  .wheel-area {
    width: min(
      66vh,
      600px
    );
  }

  .go-button {
    width: 90px;
    height: 90px;
    font-size: 24px;
  }

  .pointer {
    border-left-width: 21px;
    border-right-width: 21px;
    border-top-width: 44px;
  }

}

</style>

</head>

<body>

<div class="app">


<!-- =========================
     左側
========================= -->

<main class="panel main-panel">


  <div class="title">
    班級座號轉盤
  </div>


  <div class="subtitle">
    1～11 號｜抽過不重複
  </div>


  <div class="wheel-wrap">

    <div class="wheel-area">

      <div class="wheel-shadow"></div>

      <canvas
        id="wheel"
        width="800"
        height="800">
      </canvas>

      <div class="pointer"></div>

      <button
        id="goButton"
        class="go-button"
        type="button">

        GO

      </button>

    </div>

  </div>


  <div
    id="status"
    class="bottom-status">

    目前有 11 位可以抽

  </div>


  <div class="hint">
    點擊中間 GO 開始轉盤
  </div>


</main>



<!-- =========================
     右側
========================= -->

<aside class="side">


  <!-- 抽幾位 -->

  <section class="panel side-panel">

    <div class="draw-settings">

      <div class="draw-settings-label">
        這次要抽
      </div>


      <select id="drawCount">

        <option value="1">1 位</option>
        <option value="2">2 位</option>
        <option value="3">3 位</option>
        <option value="4">4 位</option>
        <option value="5">5 位</option>
        <option value="6">6 位</option>
        <option value="7">7 位</option>
        <option value="8">8 位</option>
        <option value="9">9 位</option>
        <option value="10">10 位</option>
        <option value="11">11 位</option>

      </select>

    </div>

  </section>



  <!-- 今日不參與 -->

  <section class="panel side-panel">

    <div class="section-title">

      <span>
        今日不參與
      </span>

      <button
        id="restoreAllBtn"
        class="restore-btn"
        type="button">

        恢復全員

      </button>

    </div>


    <div
      id="absenceList"
      class="absence-list">
    </div>

  </section>



  <!-- 尚未抽到 -->

  <section class="panel side-panel">

    <div class="section-title">

      <span>
        尚未抽到
      </span>

      <span id="remainingCount">
        11 人
      </span>

    </div>


    <div
      id="remainingList"
      class="number-list">
    </div>

  </section>



  <!-- 已抽過 -->

  <section class="panel side-panel">

    <div class="section-title">

      <span>
        已抽過
      </span>

      <span id="drawnCount">
        0 人
      </span>

    </div>


    <div
      id="drawnList"
      class="number-list">

      <span class="empty-text">
        尚未有人被抽到
      </span>

    </div>

  </section>



  <!-- 本輪抽中 -->

  <section class="panel side-panel">

    <div class="section-title">

      <span>
        本輪抽中
      </span>

      <span id="roundCount">
        0 人
      </span>

    </div>


    <div
      id="roundList"
      class="round-list">

      <span class="empty-text">
        尚未開始抽籤
      </span>

    </div>

  </section>



  <!-- 操作 -->

  <div class="actions">

    <button
      id="putBackBtn"
      class="action-btn"
      disabled>

      ↩ 放回上一輪

    </button>


    <button
      id="resetBtn"
      class="action-btn">

      🔄 重新開始

    </button>

  </div>


</aside>

</div>



<script>

/* =========================
   基本設定
========================= */

const TOTAL = 11;


/*
  每次轉盤時間
  10 秒
*/

const SPIN_TIME = 10000;


/*
  多人抽籤之間停多久
*/

const BETWEEN_SPINS = 1200;



let remaining = [];

let drawn = [];

let excluded = [];

let lastRound = [];

let currentRotation = 0;

let isDrawing = false;



/* =========================
   DOM
========================= */

const wheel =
  document.getElementById("wheel");


const ctx =
  wheel.getContext("2d");


const goButton =
  document.getElementById("goButton");


const drawCount =
  document.getElementById("drawCount");


const resetBtn =
  document.getElementById("resetBtn");


const putBackBtn =
  document.getElementById("putBackBtn");


const restoreAllBtn =
  document.getElementById("restoreAllBtn");


const absenceList =
  document.getElementById("absenceList");


const remainingList =
  document.getElementById("remainingList");


const drawnList =
  document.getElementById("drawnList");


const remainingCount =
  document.getElementById("remainingCount");


const drawnCount =
  document.getElementById("drawnCount");


const roundList =
  document.getElementById("roundList");


const roundCount =
  document.getElementById("roundCount");


const status =
  document.getElementById("status");



/* =========================
   等待
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}



/* =========================
   可抽座號
========================= */

function getAvailableNumbers() {

  return remaining.filter(
    number =>
      !excluded.includes(number)
  );

}



/* =========================
   畫轉盤
========================= */

function drawWheel() {


  const numbers =
    getAvailableNumbers();


  const size =
    wheel.width;


  const center =
    size / 2;


  const radius =
    center - 20;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );



  if (
    numbers.length === 0
  ) {


    ctx.beginPath();


    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#E8E0D5";


    ctx.fill();


    ctx.fillStyle =
      "#756D63";


    ctx.font =
      "bold 45px Microsoft JhengHei";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(
      "無可抽座號",
      center,
      center - 135
    );


    return;

  }



  const slice =
    (Math.PI * 2) /
    numbers.length;



  const colors = [

    "#EDE5D9",

    "#D8CBB9",

    "#C7B59D"

  ];



  numbers.forEach(
    (number, index) => {


      const startAngle =

        -Math.PI / 2 +

        index * slice;


      const endAngle =

        startAngle +

        slice;



      ctx.beginPath();


      ctx.moveTo(
        center,
        center
      );


      ctx.arc(
        center,
        center,
        radius,
        startAngle,
        endAngle
      );


      ctx.closePath();



      ctx.fillStyle =

        colors[
          index %
          colors.length
        ];


      ctx.fill();



      ctx.strokeStyle =
        "#FFFDF8";


      ctx.lineWidth =
        4;


      ctx.stroke();



      /* =========================
         座號
      ========================= */

      const middleAngle =

        startAngle +

        slice / 2;



      const textRadius =

        radius * 0.72;



      const x =

        center +

        Math.cos(
          middleAngle
        ) *

        textRadius;



      const y =

        center +

        Math.sin(
          middleAngle
        ) *

        textRadius;



      ctx.save();


      ctx.translate(
        x,
        y
      );


      ctx.rotate(
        middleAngle +
        Math.PI / 2
      );


      ctx.fillStyle =
        "#37322C";


      let fontSize = 54;


      if (
        numbers.length >= 9
      ) {

        fontSize = 45;

      }


      if (
        numbers.length <= 5
      ) {

        fontSize = 58;

      }



      ctx.font =
        `900 ${fontSize}px Microsoft JhengHei`;


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillText(
        number + "號",
        0,
        0
      );


      ctx.restore();

    }

  );



  /* 外框 */

  ctx.beginPath();


  ctx.arc(
    center,
    center,
    radius,
    0,
    Math.PI * 2
  );


  ctx.strokeStyle =
    "#5D554A";


  ctx.lineWidth =
    12;


  ctx.stroke();

}



/* =========================
   重設角度
========================= */

function resetWheelAngle() {


  wheel.style.transition =
    "none";


  currentRotation = 0;


  wheel.style.transform =
    "rotate(0deg)";


  void wheel.offsetWidth;

}



/* =========================
   今日不參與
========================= */

function renderAbsenceButtons() {


  absenceList.innerHTML =
    "";


  for (
    let number = 1;
    number <= TOTAL;
    number++
  ) {


    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "absence-btn";


    button.textContent =
      number + "號";


    if (
      excluded.includes(number)
    ) {


      button.classList.add(
        "excluded"
      );

    }


    button.disabled =
      isDrawing;


    button.addEventListener(

      "click",

      () =>
        toggleExcluded(number)

    );


    absenceList.appendChild(
      button
    );

  }

}



/* =========================
   更新右側
========================= */

function render() {


  renderAbsenceButtons();


  const available =
    getAvailableNumbers();



  /* 尚未抽到 */

  remainingList.innerHTML =
    "";


  available.forEach(
    number => {


      const chip =
        document.createElement(
          "div"
        );


      chip.className =
        "number-chip";


      chip.textContent =
        number + "號";


      remainingList.appendChild(
        chip
      );

    }

  );



  /* 已抽過 */

  drawnList.innerHTML =
    "";


  if (
    drawn.length === 0
  ) {


    const empty =
      document.createElement(
        "span"
      );


    empty.className =
      "empty-text";


    empty.textContent =
      "尚未有人被抽到";


    drawnList.appendChild(
      empty
    );


  } else {


    drawn.forEach(
      number => {


        const chip =
          document.createElement(
            "div"
          );


        chip.className =
          "number-chip drawn";


        chip.textContent =
          number + "號";


        drawnList.appendChild(
          chip
        );

      }

    );

  }



  /* 本輪抽中 */

  renderRoundResults();



  remainingCount.textContent =

    available.length +

    " 人";


  drawnCount.textContent =

    drawn.length +

    " 人";


  roundCount.textContent =

    lastRound.length +

    " 人";



  if (
    !isDrawing
  ) {


    if (
      available.length === 0
    ) {


      status.textContent =
        "目前沒有可抽的座號";


      goButton.disabled =
        true;


    } else {


      status.textContent =

        "目前有 " +

        available.length +

        " 位可以抽";


      goButton.disabled =
        false;

    }

  }



  putBackBtn.disabled =

    lastRound.length === 0 ||

    isDrawing;



  restoreAllBtn.disabled =

    excluded.length === 0 ||

    isDrawing;



  drawWheel();

}



/* =========================
   本輪結果
========================= */

function renderRoundResults() {


  roundList.innerHTML =
    "";


  if (
    lastRound.length === 0
  ) {


    const empty =
      document.createElement(
        "span"
      );


    empty.className =
      "empty-text";


    empty.textContent =
      "尚未開始抽籤";


    roundList.appendChild(
      empty
    );


    return;

  }



  lastRound.forEach(
    (number, index) => {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "round-card";


      card.innerHTML = `

        <div class="round-order">

          第 ${index + 1} 位

        </div>

        <div class="round-number">

          ${number}號

        </div>

      `;


      roundList.appendChild(
        card
      );

    }

  );

}



/* =========================
   不參與
========================= */

function toggleExcluded(
  number
) {


  if (
    isDrawing
  ) {

    return;

  }



  if (
    drawn.includes(number)
  ) {


    alert(

      number +

      "號已經抽過了，請重新開始後再設定。"

    );


    return;

  }



  const index =
    excluded.indexOf(number);



  if (
    index === -1
  ) {


    excluded.push(
      number
    );


  } else {


    excluded.splice(
      index,
      1
    );

  }



  resetWheelAngle();


  render();

}



/* =========================
   恢復全員
========================= */

function restoreAll() {


  if (
    isDrawing
  ) {

    return;

  }


  excluded = [];


  resetWheelAngle();


  render();


  status.textContent =
    "已恢復全員參與";

}



/* =========================
   轉一位
========================= */

async function spinOne(order) {


  const numbers =
    getAvailableNumbers();


  if (
    numbers.length === 0
  ) {

    return;

  }



  status.textContent =

    "正在抽第 " +

    order +

    " 位……";



  /* =========================
     隨機決定停止角度
     不先決定座號
  ========================= */

  const extraTurns =

    6 +

    Math.floor(
      Math.random() * 4
    );


  const randomStopAngle =

    Math.random() * 360;


  const totalRotation =

    extraTurns * 360 +

    randomStopAngle;


  currentRotation +=

    totalRotation;



  /* =========================
     慢慢減速
  ========================= */

  wheel.style.transition =

    `transform ${SPIN_TIME}ms cubic-bezier(0.08, 0.72, 0.08, 1)`;


  requestAnimationFrame(
    () => {


      wheel.style.transform =

        `rotate(${currentRotation}deg)`;

    }
  );



  await sleep(
    SPIN_TIME + 250
  );



  /* =========================
     停下後判斷箭頭位置
  ========================= */

  const finalRotation =

    (
      (
        currentRotation %
        360
      ) +
      360
    ) %
    360;



  const pointerOffset =

    (
      360 -
      finalRotation
    ) %
    360;



  const sliceDegrees =

    360 /
    numbers.length;



  let selectedIndex =

    Math.floor(

      pointerOffset /
      sliceDegrees

    );



  selectedIndex =

    selectedIndex %
    numbers.length;



  const selected =

    numbers[
      selectedIndex
    ];



  /* =========================
     記錄
  ========================= */

  const remainingIndex =

    remaining.indexOf(
      selected
    );


  if (
    remainingIndex !== -1
  ) {


    remaining.splice(
      remainingIndex,
      1
    );

  }



  drawn.push(
    selected
  );


  lastRound.push(
    selected
  );



  renderRoundResults();



  roundCount.textContent =

    lastRound.length +

    " 人";



  status.textContent =

    `第 ${order} 位：${selected}號`;



  return selected;

}



/* =========================
   開始抽籤
========================= */

async function startDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  const available =
    getAvailableNumbers();


  const amount =

    parseInt(
      drawCount.value
    );



  if (
    available.length === 0
  ) {

    return;

  }



  if (
    amount >
    available.length
  ) {


    alert(

      "目前只有 " +

      available.length +

      " 位可以抽喔！"

    );


    return;

  }



  isDrawing =
    true;


  lastRound =
    [];


  renderRoundResults();


  roundCount.textContent =
    "0 人";



  goButton.disabled =
    true;


  goButton.classList.add(
    "spinning"
  );


  goButton.textContent =
    "轉";


  drawCount.disabled =
    true;


  putBackBtn.disabled =
    true;


  restoreAllBtn.disabled =
    true;


  renderAbsenceButtons();



  /* =========================
     一位一位抽
  ========================= */

  for (
    let order = 1;
    order <= amount;
    order++
  ) {


    await spinOne(
      order
    );



    if (
      order <
      amount
    ) {


      await sleep(
        BETWEEN_SPINS
      );


      resetWheelAngle();


      drawWheel();


      await sleep(
        350
      );

    }

  }



  /* =========================
     完成
  ========================= */

  isDrawing =
    false;


  drawCount.disabled =
    false;


  goButton.classList.remove(
    "spinning"
  );


  goButton.textContent =
    "GO";



  await sleep(
    500
  );


  resetWheelAngle();


  render();


  status.textContent =

    "本輪完成，共抽出 " +

    amount +

    " 位";

}



/* =========================
   放回上一輪
========================= */

function putBack() {


  if (
    isDrawing ||
    lastRound.length === 0
  ) {

    return;

  }



  lastRound.forEach(
    number => {


      const index =
        drawn.indexOf(number);


      if (
        index !== -1
      ) {


        drawn.splice(
          index,
          1
        );

      }



      if (
        !remaining.includes(number)
      ) {


        remaining.push(
          number
        );

      }

    }

  );



  remaining.sort(
    (a,b) =>
      a - b
  );


  lastRound =
    [];


  resetWheelAngle();


  render();


  status.textContent =
    "上一輪已放回";

}



/* =========================
   重新開始
========================= */

function resetDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  lastRound =
    [];


  resetWheelAngle();


  render();


  status.textContent =

    "已重新開始，今日不參與設定已保留";

}



/* =========================
   初始化
========================= */

function initialize() {


  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  excluded =
    [];


  lastRound =
    [];


  resetWheelAngle();


  render();

}



/* =========================
   事件
========================= */

goButton.addEventListener(
  "click",
  startDraw
);


putBackBtn.addEventListener(
  "click",
  putBack
);


resetBtn.addEventListener(
  "click",
  resetDraw
);


restoreAllBtn.addEventListener(
  "click",
  restoreAll
);


/* 啟動 */

initialize();

</script>
