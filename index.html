<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>班級座號抽籤</title>


<style>

/* =========================
   基本設定
========================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 24px;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f1e9;

  color: #3f3932;

}


.app {

  width: 100%;

  max-width: 1150px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    minmax(0, 1.4fr)
    minmax(300px, .6fr);

  gap: 22px;

}


/* =========================
   卡片
========================= */

.panel {

  background: white;

  border:
    1px solid #ddd5c9;

  border-radius: 22px;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,.06);

}


/* =========================
   左側主要區域
========================= */

.main-panel {

  padding: 32px;

  text-align: center;

}


.title {

  font-size: 32px;

  font-weight: 900;

  margin-bottom: 5px;

}


.subtitle {

  color: #8a8176;

  margin-bottom: 28px;

}


/* =========================
   抽幾位
========================= */

.settings {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 10px;

  font-size: 17px;

  font-weight: 800;

}


select {

  padding:
    9px 15px;

  border:
    1px solid #cdc3b5;

  border-radius: 10px;

  background: white;

  color: #3f3932;

  font-size: 16px;

  font-weight: 700;

}


/* =========================
   大座號顯示
========================= */

.lottery-area {

  min-height: 330px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

}


.big-number {

  width: 240px;

  height: 240px;

  border-radius: 50%;

  display: flex;

  justify-content: center;

  align-items: center;

  margin: 25px auto;

  background:
    #ede5d9;

  border:
    8px solid
    #c8b79f;

  box-shadow:
    0 12px 28px
    rgba(77,65,51,.14);

  font-size: 82px;

  font-weight: 900;

  color: #443d35;

  transition:
    transform .15s ease;

}


.big-number.rolling {

  transform:
    scale(1.05);

}


/* =========================
   開始按鈕
========================= */

.draw-btn {

  padding:
    14px 44px;

  border: none;

  border-radius: 15px;

  background:
    #665b4d;

  color: white;

  font-size: 18px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.15);

  transition:
    transform .15s ease,
    background .15s ease;

}


.draw-btn:hover {

  background:
    #564c40;

  transform:
    translateY(-2px);

}


.draw-btn:active {

  transform:
    translateY(0);

}


.draw-btn:disabled {

  opacity: .5;

  cursor:
    not-allowed;

}


/* =========================
   結果
========================= */

.result-title {

  margin-top: 26px;

  margin-bottom: 9px;

  font-size: 15px;

  color: #847b70;

  font-weight: 800;

}


.result-box {

  min-height: 80px;

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 10px;

}


.result-card {

  min-width: 105px;

  padding:
    10px 15px;

  border-radius: 14px;

  background:
    #eee6da;

  border:
    2px solid
    #c9baa6;

  animation:
    pop .4s ease;

}


.result-order {

  color:
    #83776a;

  font-size: 13px;

  font-weight: 800;

}


.result-number {

  margin-top: 2px;

  font-size: 29px;

  font-weight: 900;

}


@keyframes pop {

  0% {
    transform: scale(.6);
  }

  70% {
    transform: scale(1.1);
  }

  100% {
    transform: scale(1);
  }

}


/* =========================
   狀態
========================= */

.status {

  min-height: 25px;

  margin-top: 12px;

  color: #756d63;

  font-size: 15px;

  font-weight: 700;

}


/* =========================
   右側
========================= */

.side {

  display: flex;

  flex-direction: column;

  gap: 15px;

}


.side-panel {

  padding: 20px;

}


.section-title {

  margin-bottom: 13px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  font-size: 18px;

  font-weight: 900;

}


/* =========================
   座號標籤
========================= */

.number-list {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

}


.number-chip {

  min-width: 48px;

  padding:
    9px 8px;

  border-radius: 10px;

  text-align: center;

  background:
    #f1ede6;

  border:
    1px solid #ded5c9;

  font-weight: 800;

}


.number-chip.drawn {

  background:
    #e2dfda;

  color:
    #969088;

  text-decoration:
    line-through;

}


/* =========================
   今日不參與
========================= */

.absence-list {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

}


.absence-btn {

  min-width: 48px;

  padding:
    8px;

  border:
    1px solid #d4cabd;

  border-radius: 10px;

  background: white;

  color: #403a33;

  font-weight: 800;

  cursor: pointer;

}


.absence-btn:hover {

  background:
    #f3eee5;

}


.absence-btn.excluded {

  background:
    #d9d4cc;

  color:
    #77716a;

  text-decoration:
    line-through;

}


.absence-btn:disabled {

  cursor:
    not-allowed;

}


/* =========================
   恢復全員
========================= */

.restore-btn {

  padding:
    6px 9px;

  border:
    1px solid #cdc3b5;

  border-radius: 8px;

  background: white;

  color: #453f37;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}


.restore-btn:disabled {

  opacity: .4;

  cursor:
    not-allowed;

}


/* =========================
   操作按鈕
========================= */

.actions {

  display: flex;

  gap: 9px;

}


.action-btn {

  flex: 1;

  padding:
    13px 7px;

  border:
    1px solid #cdc4b7;

  border-radius: 11px;

  background: white;

  color: #403a33;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

}


.action-btn:hover {

  background:
    #f4efe7;

}


.action-btn:disabled {

  opacity: .4;

  cursor:
    not-allowed;

}


/* =========================
   手機版
========================= */

@media
(max-width: 800px) {

  .app {

    grid-template-columns:
      1fr;

  }

  .main-panel {

    padding:
      25px 15px;

  }

  .big-number {

    width: 200px;

    height: 200px;

    font-size: 68px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =========================
     左側抽籤區
========================= -->

<main
  class="panel main-panel">


  <div class="title">

    班級座號抽籤

  </div>


  <div class="subtitle">

    1～11 號｜抽過不重複

  </div>


  <div class="settings">


    <span>

      這次要抽

    </span>


    <select id="drawCount">

      <option value="1">1 位</option>

      <option value="2">2 位</option>

      <option value="3">3 位</option>

      <option value="4">4 位</option>

      <option value="5">5 位</option>

      <option value="6">6 位</option>

      <option value="7">7 位</option>

      <option value="8">8 位</option>

      <option value="9">9 位</option>

      <option value="10">10 位</option>

      <option value="11">11 位</option>

    </select>


  </div>


  <div class="lottery-area">


    <div
      id="bigNumber"
      class="big-number">

      ?

    </div>


    <button
      id="drawBtn"
      class="draw-btn"
      type="button">

      開始抽籤

    </button>


  </div>


  <div class="result-title">

    本輪抽籤結果

  </div>


  <div
    id="resultBox"
    class="result-box">

  </div>


  <div
    id="status"
    class="status">

    目前有 11 位可以抽

  </div>


</main>



<!-- =========================
     右側
========================= -->

<aside class="side">


  <!-- 今日不參與 -->

  <section
    class="panel side-panel">


    <div class="section-title">


      <span>

        今日不參與

      </span>


      <button
        id="restoreAllBtn"
        class="restore-btn"
        type="button">

        恢復全員

      </button>


    </div>


    <div
      id="absenceList"
      class="absence-list">

    </div>


  </section>



  <!-- 尚未抽到 -->

  <section
    class="panel side-panel">


    <div class="section-title">


      <span>

        尚未抽到

      </span>


      <span
        id="remainingCount">

        11 人

      </span>


    </div>


    <div
      id="remainingList"
      class="number-list">

    </div>


  </section>



  <!-- 已抽過 -->

  <section
    class="panel side-panel">


    <div class="section-title">


      <span>

        已抽過

      </span>


      <span
        id="drawnCount">

        0 人

      </span>


    </div>


    <div
      id="drawnList"
      class="number-list">

      尚未有人被抽到

    </div>


  </section>



  <!-- 操作 -->

  <div class="actions">


    <button
      id="putBackBtn"
      class="action-btn"
      disabled>

      ↩ 放回上一輪

    </button>


    <button
      id="resetBtn"
      class="action-btn">

      🔄 重新開始

    </button>


  </div>


</aside>


</div>



<script>

/* =========================
   基本設定
========================= */

const TOTAL = 11;


/*
  每一位跳動多久
  2000 = 約 2 秒
*/

const ROLL_TIME = 2000;


/*
  抽多人時，
  每一位之間等待時間
*/

const BETWEEN_DRAW = 900;



let remaining = [];

let drawn = [];

let excluded = [];

let lastRound = [];

let isDrawing = false;



/* =========================
   DOM
========================= */

const bigNumber =
  document.getElementById(
    "bigNumber"
  );


const drawBtn =
  document.getElementById(
    "drawBtn"
  );


const drawCount =
  document.getElementById(
    "drawCount"
  );


const resultBox =
  document.getElementById(
    "resultBox"
  );


const status =
  document.getElementById(
    "status"
  );


const remainingList =
  document.getElementById(
    "remainingList"
  );


const drawnList =
  document.getElementById(
    "drawnList"
  );


const remainingCount =
  document.getElementById(
    "remainingCount"
  );


const drawnCount =
  document.getElementById(
    "drawnCount"
  );


const absenceList =
  document.getElementById(
    "absenceList"
  );


const restoreAllBtn =
  document.getElementById(
    "restoreAllBtn"
  );


const putBackBtn =
  document.getElementById(
    "putBackBtn"
  );


const resetBtn =
  document.getElementById(
    "resetBtn"
  );



/* =========================
   等待
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}



/* =========================
   目前可以抽的座號
========================= */

function getAvailableNumbers() {

  return remaining.filter(

    number =>
      !excluded.includes(
        number
      )

  );

}



/* =========================
   今日不參與
========================= */

function renderAbsenceButtons() {


  absenceList.innerHTML =
    "";


  for (
    let number = 1;
    number <= TOTAL;
    number++
  ) {


    const button =

      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "absence-btn";


    button.textContent =
      number + "號";


    if (
      excluded.includes(
        number
      )
    ) {


      button.classList.add(
        "excluded"
      );

    }



    button.disabled =
      isDrawing;



    button.addEventListener(

      "click",

      () =>
        toggleExcluded(
          number
        )

    );


    absenceList.appendChild(
      button
    );

  }

}



/* =========================
   更新右側
========================= */

function render() {


  renderAbsenceButtons();


  const available =
    getAvailableNumbers();



  /* 尚未抽到 */

  remainingList.innerHTML =
    "";


  available.forEach(
    number => {


      const chip =

        document.createElement(
          "div"
        );


      chip.className =
        "number-chip";


      chip.textContent =
        number + "號";


      remainingList.appendChild(
        chip
      );

    }

  );



  /* 已抽過 */

  drawnList.innerHTML =
    "";


  if (
    drawn.length === 0
  ) {


    drawnList.textContent =
      "尚未有人被抽到";


  } else {


    drawn.forEach(
      number => {


        const chip =

          document.createElement(
            "div"
          );


        chip.className =
          "number-chip drawn";


        chip.textContent =
          number + "號";


        drawnList.appendChild(
          chip
        );

      }

    );

  }



  remainingCount.textContent =

    available.length +

    " 人";



  drawnCount.textContent =

    drawn.length +

    " 人";



  if (
    !isDrawing
  ) {


    if (
      available.length === 0
    ) {


      status.textContent =
        "目前沒有可抽的座號";


      drawBtn.disabled =
        true;


    } else {


      status.textContent =

        "目前有 " +

        available.length +

        " 位可以抽";


      drawBtn.disabled =
        false;

    }

  }



  putBackBtn.disabled =

    lastRound.length === 0 ||

    isDrawing;



  restoreAllBtn.disabled =

    excluded.length === 0 ||

    isDrawing;

}



/* =========================
   設定不參與
========================= */

function toggleExcluded(
  number
) {


  if (
    isDrawing
  ) {

    return;

  }



  /*
    已抽中的人不能再設定
    今日不參與
  */

  if (
    drawn.includes(
      number
    )
  ) {


    alert(

      number +

      "號已經抽過了，請重新開始後再設定。"

    );


    return;

  }



  const index =

    excluded.indexOf(
      number
    );



  if (
    index === -1
  ) {


    excluded.push(
      number
    );


  } else {


    excluded.splice(
      index,
      1
    );

  }



  bigNumber.textContent =
    "?";


  render();

}



/* =========================
   恢復全員
========================= */

function restoreAll() {


  if (
    isDrawing
  ) {

    return;

  }


  excluded = [];


  bigNumber.textContent =
    "?";


  render();


  status.textContent =
    "已恢復全員參與";

}



/* =========================
   隨機取得一個座號
========================= */

function randomNumber(
  numbers
) {


  return numbers[
    Math.floor(
      Math.random() *
      numbers.length
    )
  ];

}



/* =========================
   跳動動畫
========================= */

async function rollOne(
  order
) {


  const available =
    getAvailableNumbers();


  if (
    available.length === 0
  ) {

    return null;

  }



  /*
    真正結果先隨機決定
  */

  const selected =

    randomNumber(
      available
    );



  bigNumber.classList.add(
    "rolling"
  );


  status.textContent =

    "正在抽第 " +

    order +

    " 位……";



  const startTime =
    Date.now();



  /*
    一開始跳比較快，
    越後面越慢
  */

  let delay = 65;



  while (
    Date.now() -
    startTime <
    ROLL_TIME
  ) {


    const currentAvailable =
      getAvailableNumbers();


    bigNumber.textContent =

      randomNumber(
        currentAvailable
      ) +

      "號";



    await sleep(
      delay
    );



    /*
      越接近結束，
      跳動速度逐漸變慢
    */

    const progress =

      (
        Date.now() -
        startTime
      ) /

      ROLL_TIME;



    delay =

      65 +

      progress *
      progress *
      260;

  }



  /*
    最後停在真正抽中的座號
  */

  bigNumber.textContent =

    selected +

    "號";


  bigNumber.classList.remove(
    "rolling"
  );



  /* =========================
     記錄結果
  ========================= */

  const index =

    remaining.indexOf(
      selected
    );


  if (
    index !== -1
  ) {


    remaining.splice(
      index,
      1
    );

  }



  drawn.push(
    selected
  );


  lastRound.push(
    selected
  );



  /* =========================
     顯示順序結果
  ========================= */

  const card =

    document.createElement(
      "div"
    );


  card.className =
    "result-card";


  card.innerHTML = `

    <div class="result-order">

      第 ${order} 位

    </div>

    <div class="result-number">

      ${selected}號

    </div>

  `;


  resultBox.appendChild(
    card
  );



  status.textContent =

    `第 ${order} 位：${selected}號`;



  return selected;

}



/* =========================
   開始抽籤
========================= */

async function startDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  const available =
    getAvailableNumbers();



  const amount =

    parseInt(
      drawCount.value
    );



  if (
    available.length === 0
  ) {

    return;

  }



  if (
    amount >
    available.length
  ) {


    alert(

      "目前只有 " +

      available.length +

      " 位可以抽喔！"

    );


    return;

  }



  isDrawing =
    true;


  lastRound =
    [];


  resultBox.innerHTML =
    "";



  drawBtn.disabled =
    true;


  drawCount.disabled =
    true;


  putBackBtn.disabled =
    true;


  restoreAllBtn.disabled =
    true;


  renderAbsenceButtons();



  /* =========================
     一個一個抽
  ========================= */

  for (
    let order = 1;
    order <= amount;
    order++
  ) {


    await rollOne(
      order
    );



    /*
      立刻更新，
      剛抽到的人就不會
      再出現在下一輪
    */

    render();



    if (
      order <
      amount
    ) {


      await sleep(
        BETWEEN_DRAW
      );

    }

  }



  /* =========================
     完成
  ========================= */

  isDrawing =
    false;


  drawCount.disabled =
    false;


  render();



  status.textContent =

    "本輪完成，共抽出 " +

    amount +

    " 位";

}



/* =========================
   放回上一輪
========================= */

function putBack() {


  if (
    isDrawing ||
    lastRound.length === 0
  ) {

    return;

  }



  lastRound.forEach(
    number => {


      const drawnIndex =

        drawn.indexOf(
          number
        );



      if (
        drawnIndex !== -1
      ) {


        drawn.splice(
          drawnIndex,
          1
        );

      }



      if (
        !remaining.includes(
          number
        )
      ) {


        remaining.push(
          number
        );

      }

    }

  );



  remaining.sort(
    (a, b) =>
      a - b
  );



  lastRound =
    [];


  resultBox.innerHTML =
    "";


  bigNumber.textContent =
    "?";


  render();


  status.textContent =
    "上一輪已放回";

}



/* =========================
   重新開始
========================= */

function resetDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  lastRound =
    [];


  resultBox.innerHTML =
    "";


  bigNumber.textContent =
    "?";


  /*
    注意：
    不清除 excluded，
    所以今日不參與會保留
  */

  render();


  status.textContent =

    "已重新開始，今日不參與設定已保留";

}



/* =========================
   初始化
========================= */

function initialize() {


  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  excluded =
    [];


  lastRound =
    [];


  bigNumber.textContent =
    "?";


  resultBox.innerHTML =
    "";


  render();

}



/* =========================
   按鈕
========================= */

drawBtn.addEventListener(
  "click",
  startDraw
);


putBackBtn.addEventListener(
  "click",
  putBack
);


resetBtn.addEventListener(
  "click",
  resetDraw
);


restoreAllBtn.addEventListener(
  "click",
  restoreAll
);



/* =========================
   啟動
========================= */

initialize();

</script>

</body>

</html>
