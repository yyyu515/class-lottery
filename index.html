<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>班級座號抽籤</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f6f3ec;
      color: #3e3a35;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #ddd7cc;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }

    .main-panel {
      text-align: center;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #7a746b;
      margin-bottom: 22px;
    }

    .draw-settings {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 17px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    select {
      font-size: 17px;
      padding: 10px 14px;
      border: 1px solid #cfc7bb;
      border-radius: 10px;
      background: white;
      color: #3e3a35;
      cursor: pointer;
    }

    .absence-box {
      margin: 0 auto 20px;
      padding: 16px;
      border: 1px solid #ded6c9;
      border-radius: 16px;
      background: #faf8f4;
      text-align: left;
    }

    .absence-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .absence-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .absence-btn {
      min-width: 54px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #d6cec2;
      background: white;
      font-weight: 800;
      cursor: pointer;
      color: #3e3a35;
    }

    .absence-btn:hover {
      background: #f1ede5;
    }

    .absence-btn.excluded {
      background: #d8d3cb;
      color: #777168;
      text-decoration: line-through;
    }

    .restore-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #cfc7bb;
      background: white;
      font-weight: 700;
      cursor: pointer;
    }

    .result-area {
      min-height: 270px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 16px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .result-order {
      font-size: 18px;
      font-weight: 800;
      color: #756957;
    }

    .number-circle {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee8dc;
      border: 5px solid #c6baa6;
      font-size: 56px;
      font-weight: 900;
      transition:
        transform 0.15s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .number-circle.rolling {
      transform: scale(1.04);
    }

    .number-circle.final {
      animation: pop 0.45s ease;
      background: #e4dccd;
      border-color: #9f907a;
    }

    .question {
      width: 200px;
      height: 200px;
      font-size: 90px;
    }

    @keyframes pop {
      0% {
        transform: scale(0.75);
      }

      60% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }
    }

    .draw-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 18px;
      margin-top: 10px;
      font-size: 23px;
      font-weight: 800;
      background: #756957;
      color: white;
      cursor: pointer;
    }

    .draw-btn:hover {
      opacity: 0.9;
    }

    .draw-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 16px;
      color: #777168;
      min-height: 24px;
    }

    .hint {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #999289;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 800;
    }

    .number-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .number-chip {
      min-width: 54px;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      background: #f1ede5;
      border: 1px solid #ded6c9;
    }

    .number-chip.drawn {
      background: #e6e3dd;
      color: #99948d;
      text-decoration: line-through;
    }

    .number-chip.excluded {
      background: #ddd9d2;
      color: #777168;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 13px;
      border: 1px solid #cfc7bb;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #f5f1ea;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .result-area {
        min-height: 200px;
      }

      .number-circle {
        width: 105px;
        height: 105px;
        font-size: 46px;
      }

      .question {
        width: 160px;
        height: 160px;
        font-size: 70px;
      }

      .title {
        font-size: 26px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <section class="panel main-panel">

    <div class="title">
      班級座號抽籤
    </div>

    <div class="subtitle">
      1～11 號｜抽過不重複
    </div>

    <div class="draw-settings">

      <label for="drawCount">
        這次要抽
      </label>

      <select id="drawCount">
        <option value="1">1 位</option>
        <option value="2">2 位</option>
        <option value="3">3 位</option>
        <option value="4">4 位</option>
        <option value="5">5 位</option>
        <option value="6">6 位</option>
        <option value="7">7 位</option>
        <option value="8">8 位</option>
        <option value="9">9 位</option>
        <option value="10">10 位</option>
        <option value="11">11 位</option>
      </select>

    </div>

    <div class="absence-box">

      <div class="absence-title">

        <span>
          今日請假／不參與抽籤
        </span>

        <button
          class="restore-btn"
          id="restoreAllBtn"
          type="button">
          恢復全員
        </button>

      </div>

      <div
        class="absence-list"
        id="absenceList">
      </div>

    </div>

    <div class="result-area" id="resultArea">

      <div class="number-circle question">
        ？
      </div>

    </div>

    <button class="draw-btn" id="drawBtn">
      🎲 開始抽籤
    </button>

    <div class="status" id="status">
      目前有 11 位可以抽
    </div>

    <div class="hint">
      多人抽籤時會依序開出；請假座號不會被抽中。
    </div>

  </section>

  <div class="side">

    <section class="panel">

      <div class="section-title">

        <span>
          尚未抽到
        </span>

        <span id="remainingCount">
          11 人
        </span>

      </div>

      <div
        class="number-list"
        id="remainingList">
      </div>

    </section>

    <section class="panel">

      <div class="section-title">

        <span>
          今日不參與
        </span>

        <span id="excludedCount">
          0 人
        </span>

      </div>

      <div
        class="number-list"
        id="excludedList">

        無

      </div>

    </section>

    <section class="panel">

      <div class="section-title">

        <span>
          已抽過
        </span>

        <span id="drawnCount">
          0 人
        </span>

      </div>

      <div
        class="number-list"
        id="drawnList">

        尚未有人被抽到

      </div>

    </section>

    <div class="actions">

      <button
        class="action-btn"
        id="putBackBtn"
        disabled>

        ↩ 放回上一輪

      </button>

      <button
        class="action-btn"
        id="resetBtn">

        🔄 重新開始

      </button>

    </div>

  </div>

</div>

<script>

const TOTAL = 11;

const ROLLING_TIME = 2000;
const BETWEEN_TIME = 900;
const ROLL_SPEED = 85;

let remaining = [];
let drawn = [];
let excluded = [];
let lastRound = [];
let isDrawing = false;

const resultArea =
  document.getElementById("resultArea");

const drawBtn =
  document.getElementById("drawBtn");

const resetBtn =
  document.getElementById("resetBtn");

const putBackBtn =
  document.getElementById("putBackBtn");

const restoreAllBtn =
  document.getElementById("restoreAllBtn");

const drawCount =
  document.getElementById("drawCount");

const remainingList =
  document.getElementById("remainingList");

const drawnList =
  document.getElementById("drawnList");

const excludedList =
  document.getElementById("excludedList");

const absenceList =
  document.getElementById("absenceList");

const remainingCount =
  document.getElementById("remainingCount");

const drawnCount =
  document.getElementById("drawnCount");

const excludedCount =
  document.getElementById("excludedCount");

const status =
  document.getElementById("status");


function sleep(ms) {
  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


function getAvailableNumbers() {

  return remaining.filter(number =>
    !excluded.includes(number)
  );

}


function initializeAll() {

  remaining = [];

  for (let i = 1; i <= TOTAL; i++) {
    remaining.push(i);
  }

  drawn = [];
  excluded = [];
  lastRound = [];
  isDrawing = false;

  resultArea.innerHTML = `
    <div class="number-circle question">
      ？
    </div>
  `;

  drawCount.disabled = false;

  render();
}


function resetDrawOnly() {

  remaining = [];

  for (let i = 1; i <= TOTAL; i++) {
    remaining.push(i);
  }

  drawn = [];
  lastRound = [];
  isDrawing = false;

  resultArea.innerHTML = `
    <div class="number-circle question">
      ？
    </div>
  `;

  drawCount.disabled = false;

  render();

  status.textContent =
    "抽籤紀錄已重新開始，請假設定已保留";
}


function renderAbsenceButtons() {

  absenceList.innerHTML = "";

  for (let number = 1; number <= TOTAL; number++) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "absence-btn";

    if (excluded.includes(number)) {
      button.classList.add("excluded");
      button.textContent =
        number + "號";
    } else {
      button.textContent =
        number + "號";
    }

    button.disabled =
      isDrawing;

    button.addEventListener(
      "click",
      () => toggleExcluded(number)
    );

    absenceList.appendChild(button);
  }

}


function render() {

  renderAbsenceButtons();

  const available =
    getAvailableNumbers();


  remainingList.innerHTML = "";

  available.forEach(number => {

    const chip =
      document.createElement("div");

    chip.className =
      "number-chip";

    chip.textContent =
      number + "號";

    remainingList.appendChild(chip);

  });


  excludedList.innerHTML = "";

  if (excluded.length === 0) {

    excludedList.textContent =
      "無";

  } else {

    [...excluded]
      .sort((a, b) => a - b)
      .forEach(number => {

        const chip =
          document.createElement("div");

        chip.className =
          "number-chip excluded";

        chip.textContent =
          number + "號";

        excludedList.appendChild(chip);

      });

  }


  drawnList.innerHTML = "";

  if (drawn.length === 0) {

    drawnList.textContent =
      "尚未有人被抽到";

  } else {

    drawn.forEach(number => {

      const chip =
        document.createElement("div");

      chip.className =
        "number-chip drawn";

      chip.textContent =
        number + "號";

      drawnList.appendChild(chip);

    });

  }


  remainingCount.textContent =
    available.length + " 人";

  drawnCount.textContent =
    drawn.length + " 人";

  excludedCount.textContent =
    excluded.length + " 人";


  if (available.length === 0) {

    status.textContent =
      "目前沒有可抽的座號";

    drawBtn.disabled = true;

  } else if (!isDrawing) {

    status.textContent =
      "目前有 " +
      available.length +
      " 位可以抽";

    drawBtn.disabled = false;

  }


  putBackBtn.disabled =
    lastRound.length === 0 ||
    isDrawing;

  restoreAllBtn.disabled =
    isDrawing ||
    excluded.length === 0;
}


function toggleExcluded(number) {

  if (isDrawing) {
    return;
  }


  if (drawn.includes(number)) {

    alert(
      number +
      "號已經被抽過，請先重新開始抽籤後再設定不參與。"
    );

    return;
  }


  const index =
    excluded.indexOf(number);


  if (index === -1) {

    excluded.push(number);

  } else {

    excluded.splice(index, 1);

  }


  render();
}


function restoreAll() {

  if (isDrawing) {
    return;
  }

  excluded = [];

  render();

  status.textContent =
    "已恢復全員參與抽籤";
}


async function drawNumbers() {

  if (isDrawing) {
    return;
  }


  const available =
    getAvailableNumbers();


  if (available.length === 0) {
    return;
  }


  const amount =
    parseInt(drawCount.value);


  if (amount > available.length) {

    alert(
      "目前只有 " +
      available.length +
      " 位可以抽喔！"
    );

    return;
  }


  isDrawing = true;
  lastRound = [];

  drawBtn.disabled = true;
  putBackBtn.disabled = true;
  drawCount.disabled = true;

  renderAbsenceButtons();

  resultArea.innerHTML = "";


  for (
    let order = 0;
    order < amount;
    order++
  ) {

    status.textContent =
      "正在抽第 " +
      (order + 1) +
      " 位…";


    const item =
      document.createElement("div");

    item.className =
      "result-item";


    const orderLabel =
      document.createElement("div");

    orderLabel.className =
      "result-order";

    orderLabel.textContent =
      "第 " +
      (order + 1) +
      " 位";


    const circle =
      document.createElement("div");

    circle.className =
      "number-circle rolling";

    circle.textContent =
      "？";


    item.appendChild(orderLabel);
    item.appendChild(circle);

    resultArea.appendChild(item);


    const startTime =
      Date.now();


    while (
      Date.now() - startTime <
      ROLLING_TIME
    ) {

      const currentAvailable =
        getAvailableNumbers();


      const previewNumber =
        currentAvailable[
          Math.floor(
            Math.random() *
            currentAvailable.length
          )
        ];


      circle.textContent =
        previewNumber;


      await sleep(ROLL_SPEED);

    }


    const currentAvailable =
      getAvailableNumbers();


    const selected =
      currentAvailable[
        Math.floor(
          Math.random() *
          currentAvailable.length
        )
      ];


    const remainingIndex =
      remaining.indexOf(selected);


    if (remainingIndex !== -1) {
      remaining.splice(
        remainingIndex,
        1
      );
    }


    lastRound.push(selected);
    drawn.push(selected);


    circle.textContent =
      selected;

    circle.classList.remove(
      "rolling"
    );

    circle.classList.add(
      "final"
    );


    status.textContent =
      "第 " +
      (order + 1) +
      " 位是 " +
      selected +
      " 號";


    render();


    if (order < amount - 1) {

      await sleep(BETWEEN_TIME);

    }

  }


  isDrawing = false;

  drawCount.disabled = false;

  render();


  status.textContent =
    "本輪抽籤完成，共抽出 " +
    amount +
    " 位";
}


function putBack() {

  if (
    lastRound.length === 0 ||
    isDrawing
  ) {
    return;
  }


  lastRound.forEach(number => {

    const drawnIndex =
      drawn.indexOf(number);

    if (drawnIndex !== -1) {
      drawn.splice(
        drawnIndex,
        1
      );
    }


    if (
      !remaining.includes(number)
    ) {
      remaining.push(number);
    }

  });


  remaining.sort(
    (a, b) => a - b
  );


  lastRound = [];


  resultArea.innerHTML = `
    <div class="number-circle question">
      ？
    </div>
  `;


  render();


  status.textContent =
    "上一輪已放回";
}


drawBtn.addEventListener(
  "click",
  drawNumbers
);

resetBtn.addEventListener(
  "click",
  resetDrawOnly
);

putBackBtn.addEventListener(
  "click",
  putBack
);

restoreAllBtn.addEventListener(
  "click",
  restoreAll
);


initializeAll();

</script>

</body>
</html>
