<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>班級座號轉盤</title>


<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {

  min-height: 100vh;

  padding: 10px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f6f2ea;

  color: #39342e;

}


/* =========================
   整體版面
========================= */

.app {

  width: 100%;

  height: calc(100vh - 20px);

  max-width: 1250px;

  display: grid;

  grid-template-columns:
    minmax(0, 1.4fr)
    minmax(280px, 0.6fr);

  gap: 14px;

}


.panel {

  background: #ffffff;

  border: 1px solid #ded7cc;

  border-radius: 20px;

  box-shadow:
    0 6px 20px
    rgba(0,0,0,.05);

}


/* =========================
   左側
========================= */

.main-panel {

  height: 100%;

  padding: 15px 22px;

  text-align: center;

  display: flex;

  flex-direction: column;

  align-items: center;

  min-height: 0;

}


.title {

  font-size: 27px;

  font-weight: 900;

  margin-bottom: 2px;

}


.subtitle {

  color: #81796d;

  margin-bottom: 7px;

  font-size: 14px;

}


.settings {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 9px;

  font-size: 15px;

  font-weight: 800;

}


select {

  padding: 7px 12px;

  border: 1px solid #cec5b8;

  border-radius: 9px;

  background: white;

  color: #39342e;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

}


/* =========================
   轉盤
========================= */

.wheel-area {

  position: relative;

  width: min(
    56vh,
    480px
  );

  aspect-ratio: 1;

  margin: 7px auto 2px;

  flex-shrink: 1;

}


.wheel-shadow {

  position: absolute;

  inset: 5%;

  border-radius: 50%;

  box-shadow:
    0 10px 22px
    rgba(0,0,0,.13);

}


#wheel {

  width: 100%;

  height: 100%;

  display: block;

  transform: rotate(0deg);

}


/* =========================
   箭頭
========================= */

.pointer {

  position: absolute;

  left: 50%;

  top: -2px;

  transform: translateX(-50%);

  width: 0;

  height: 0;

  border-left:
    20px solid transparent;

  border-right:
    20px solid transparent;

  border-top:
    40px solid #50483e;

  border-bottom: 0;

  z-index: 20;

  filter:
    drop-shadow(
      0 2px 2px
      rgba(0,0,0,.18)
    );

}


/* =========================
   GO 按鈕
========================= */

.go-button {

  position: absolute;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 78px;

  height: 78px;

  border-radius: 50%;

  border:
    6px solid #5f564b;

  background: #fffaf2;

  color: #4a433a;

  font-size: 21px;

  font-weight: 900;

  cursor: pointer;

  z-index: 15;

  box-shadow:
    0 5px 14px
    rgba(0,0,0,.15);

  transition:
    transform .15s ease,
    background .15s ease;

}


.go-button:hover {

  transform:
    translate(-50%, -50%)
    scale(1.07);

  background:
    #f1e8db;

}


.go-button:active {

  transform:
    translate(-50%, -50%)
    scale(.94);

}


.go-button:disabled {

  cursor: not-allowed;

  opacity: .65;

  transform:
    translate(-50%, -50%);

}


.go-button.spinning {

  animation:
    pulse 1s
    infinite alternate;

}


@keyframes pulse {

  from {

    box-shadow:
      0 4px 12px
      rgba(0,0,0,.14);

  }

  to {

    box-shadow:
      0 5px 22px
      rgba(86,72,55,.35);

  }

}


/* =========================
   結果
========================= */

.result-box {

  min-height: 48px;

  display: flex;

  justify-content: center;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin: 0;

}


.result-card {

  min-width: 78px;

  padding: 5px 10px;

  border-radius: 11px;

  background: #eee6da;

  border:
    1.5px solid #c9baa6;

  animation:
    pop .45s ease;

}


.result-order {

  color: #82776a;

  font-size: 10px;

  font-weight: 800;

}


.result-number {

  font-size: 20px;

  font-weight: 900;

}


@keyframes pop {

  0% {

    transform: scale(.65);

  }

  65% {

    transform: scale(1.13);

  }

  100% {

    transform: scale(1);

  }

}


/* =========================
   狀態
========================= */

.status {

  min-height: 20px;

  margin-top: 1px;

  color: #71695f;

  font-size: 13px;

  font-weight: 800;

}


.hint {

  margin-top: 1px;

  color: #aaa197;

  font-size: 10px;

}


/* =========================
   右側
========================= */

.side {

  height: 100%;

  display: grid;

  grid-template-rows:
    auto
    1fr
    1fr
    auto;

  gap: 9px;

  min-height: 0;

}


.side-panel {

  padding: 12px;

  min-height: 0;

  overflow: hidden;

}


.section-title {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  margin-bottom: 7px;

  font-size: 14px;

  font-weight: 900;

}


/* =========================
   座號區
========================= */

.number-list {

  display: flex;

  flex-wrap: wrap;

  gap: 5px;

}


.number-chip {

  min-width: 40px;

  padding: 6px 7px;

  border-radius: 8px;

  background: #f1ede5;

  border:
    1px solid #ddd4c7;

  text-align: center;

  font-size: 12px;

  font-weight: 800;

}


.number-chip.drawn {

  background: #e5e2dc;

  color: #99938a;

  text-decoration: line-through;

}


/* =========================
   今日不參與
========================= */

.absence-list {

  display: flex;

  flex-wrap: wrap;

  gap: 5px;

}


.absence-btn {

  min-width: 40px;

  padding: 6px 7px;

  border-radius: 8px;

  border:
    1px solid #d3cabd;

  background: white;

  color: #39342e;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}


.absence-btn:hover {

  background: #f3eee5;

}


.absence-btn.excluded {

  background: #d7d2ca;

  color: #77716a;

  text-decoration: line-through;

}


.absence-btn:disabled {

  cursor: not-allowed;

}


/* =========================
   恢復全員
========================= */

.restore-btn {

  padding: 4px 7px;

  border:
    1px solid #cdc3b5;

  border-radius: 7px;

  background: white;

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;

}


.restore-btn:disabled {

  opacity: .4;

  cursor: not-allowed;

}


/* =========================
   下方操作
========================= */

.actions {

  display: flex;

  gap: 6px;

}


.action-btn {

  flex: 1;

  padding: 9px 5px;

  border:
    1px solid #cdc4b7;

  border-radius: 9px;

  background: white;

  color: #39342e;

  font-size: 11px;

  font-weight: 800;

  cursor: pointer;

}


.action-btn:hover {

  background: #f5f1e9;

}


.action-btn:disabled {

  opacity: .4;

  cursor: not-allowed;

}

</style>

</head>


<body>


<div class="app">


<!-- ======================
     左側
======================= -->

<main class="panel main-panel">


  <div class="title">
    班級座號轉盤
  </div>


  <div class="subtitle">
    1～11 號｜抽過不重複
  </div>


  <div class="settings">

    <span>
      這次要抽
    </span>


    <select id="drawCount">

      <option value="1">1 位</option>
      <option value="2">2 位</option>
      <option value="3">3 位</option>
      <option value="4">4 位</option>
      <option value="5">5 位</option>
      <option value="6">6 位</option>
      <option value="7">7 位</option>
      <option value="8">8 位</option>
      <option value="9">9 位</option>
      <option value="10">10 位</option>
      <option value="11">11 位</option>

    </select>

  </div>


  <div class="wheel-area">


    <div class="wheel-shadow"></div>


    <canvas
      id="wheel"
      width="700"
      height="700">
    </canvas>


    <div class="pointer"></div>


    <button
      id="goButton"
      class="go-button"
      type="button">

      GO

    </button>


  </div>


  <div
    class="result-box"
    id="resultBox">
  </div>


  <div
    class="status"
    id="status">

    目前有 11 位可以抽

  </div>


  <div class="hint">

    點擊中間 GO 開始轉盤

  </div>


</main>



<!-- ======================
     右側
======================= -->

<aside class="side">


  <!-- 今日不參與 -->

  <section class="panel side-panel">


    <div class="section-title">


      <span>
        今日不參與
      </span>


      <button
        id="restoreAllBtn"
        class="restore-btn"
        type="button">

        恢復全員

      </button>


    </div>


    <div
      id="absenceList"
      class="absence-list">
    </div>


  </section>



  <!-- 尚未抽到 -->

  <section class="panel side-panel">


    <div class="section-title">


      <span>
        尚未抽到
      </span>


      <span
        id="remainingCount">

        11 人

      </span>


    </div>


    <div
      id="remainingList"
      class="number-list">
    </div>


  </section>



  <!-- 已抽過 -->

  <section class="panel side-panel">


    <div class="section-title">


      <span>
        已抽過
      </span>


      <span
        id="drawnCount">

        0 人

      </span>


    </div>


    <div
      id="drawnList"
      class="number-list">

      尚未有人被抽到

    </div>


  </section>



  <!-- 操作 -->

  <div class="actions">


    <button
      id="putBackBtn"
      class="action-btn"
      disabled>

      ↩ 放回上一輪

    </button>


    <button
      id="resetBtn"
      class="action-btn">

      🔄 重新開始

    </button>


  </div>


</aside>


</div>



<script>

/* =========================
   基本設定
========================= */

const TOTAL = 11;


/*
  每位轉 10 秒
*/

const SPIN_TIME = 10000;


/*
  多人抽籤間隔
*/

const BETWEEN_SPINS = 1200;



let remaining = [];

let drawn = [];

let excluded = [];

let lastRound = [];

let currentRotation = 0;

let isDrawing = false;



/* =========================
   DOM
========================= */

const wheel =
  document.getElementById("wheel");


const ctx =
  wheel.getContext("2d");


const goButton =
  document.getElementById("goButton");


const drawCount =
  document.getElementById("drawCount");


const resetBtn =
  document.getElementById("resetBtn");


const putBackBtn =
  document.getElementById("putBackBtn");


const restoreAllBtn =
  document.getElementById("restoreAllBtn");


const absenceList =
  document.getElementById("absenceList");


const remainingList =
  document.getElementById("remainingList");


const drawnList =
  document.getElementById("drawnList");


const remainingCount =
  document.getElementById("remainingCount");


const drawnCount =
  document.getElementById("drawnCount");


const resultBox =
  document.getElementById("resultBox");


const status =
  document.getElementById("status");



/* =========================
   等待
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}



/* =========================
   可抽座號
========================= */

function getAvailableNumbers() {

  return remaining.filter(

    number =>
      !excluded.includes(number)

  );

}



/* =========================
   畫轉盤
========================= */

function drawWheel() {


  const numbers =
    getAvailableNumbers();


  const size =
    wheel.width;


  const center =
    size / 2;


  const radius =
    center - 18;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );



  if (
    numbers.length === 0
  ) {


    ctx.beginPath();


    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#E8E0D5";


    ctx.fill();


    ctx.fillStyle =
      "#756D63";


    ctx.font =
      "bold 40px Microsoft JhengHei";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(
      "無可抽座號",
      center,
      center - 110
    );


    return;

  }



  const slice =
    (Math.PI * 2) /
    numbers.length;



  const colors = [

    "#EDE5D9",

    "#D8CBB9",

    "#C7B59D"

  ];



  numbers.forEach(
    (number, index) => {


      const startAngle =

        -Math.PI / 2 +

        index * slice;



      const endAngle =

        startAngle +

        slice;



      /* 扇形 */

      ctx.beginPath();


      ctx.moveTo(
        center,
        center
      );


      ctx.arc(
        center,
        center,
        radius,
        startAngle,
        endAngle
      );


      ctx.closePath();



      ctx.fillStyle =

        colors[
          index %
          colors.length
        ];


      ctx.fill();



      ctx.strokeStyle =
        "#FFFDF8";


      ctx.lineWidth =
        4;


      ctx.stroke();



      /* 座號 */

      const middleAngle =

        startAngle +

        slice / 2;



      const textRadius =

        radius * 0.72;



      const x =

        center +

        Math.cos(
          middleAngle
        ) *

        textRadius;



      const y =

        center +

        Math.sin(
          middleAngle
        ) *

        textRadius;



      ctx.save();



      ctx.translate(
        x,
        y
      );



      ctx.rotate(

        middleAngle +

        Math.PI / 2

      );



      ctx.fillStyle =
        "#37322C";



      let fontSize = 46;


      if (
        numbers.length >= 9
      ) {

        fontSize = 39;

      }



      ctx.font =

        `900 ${fontSize}px Microsoft JhengHei`;



      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";



      ctx.fillText(
        number + "號",
        0,
        0
      );



      ctx.restore();

    }

  );



  /* 外框 */

  ctx.beginPath();


  ctx.arc(
    center,
    center,
    radius,
    0,
    Math.PI * 2
  );


  ctx.strokeStyle =
    "#5D554A";


  ctx.lineWidth =
    10;


  ctx.stroke();

}



/* =========================
   重設角度
========================= */

function resetWheelAngle() {


  wheel.style.transition =
    "none";


  currentRotation = 0;


  wheel.style.transform =
    "rotate(0deg)";


  void wheel.offsetWidth;

}



/* =========================
   今日不參與
========================= */

function renderAbsenceButtons() {


  absenceList.innerHTML =
    "";


  for (
    let number = 1;
    number <= TOTAL;
    number++
  ) {


    const button =

      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "absence-btn";


    button.textContent =
      number + "號";


    if (
      excluded.includes(number)
    ) {


      button.classList.add(
        "excluded"
      );

    }



    button.disabled =
      isDrawing;



    button.addEventListener(

      "click",

      () =>
        toggleExcluded(number)

    );


    absenceList.appendChild(
      button
    );

  }

}



/* =========================
   畫面更新
========================= */

function render() {


  renderAbsenceButtons();


  const available =
    getAvailableNumbers();



  /* 尚未抽到 */

  remainingList.innerHTML =
    "";


  available.forEach(
    number => {


      const chip =

        document.createElement(
          "div"
        );


      chip.className =
        "number-chip";


      chip.textContent =
        number + "號";


      remainingList.appendChild(
        chip
      );

    }

  );



  /* 已抽過 */

  drawnList.innerHTML =
    "";


  if (
    drawn.length === 0
  ) {


    drawnList.textContent =
      "尚未有人被抽到";


  } else {


    drawn.forEach(
      number => {


        const chip =

          document.createElement(
            "div"
          );


        chip.className =
          "number-chip drawn";


        chip.textContent =
          number + "號";


        drawnList.appendChild(
          chip
        );

      }

    );

  }



  remainingCount.textContent =

    available.length +

    " 人";



  drawnCount.textContent =

    drawn.length +

    " 人";



  if (
    !isDrawing
  ) {


    if (
      available.length === 0
    ) {


      status.textContent =
        "目前沒有可抽的座號";


      goButton.disabled =
        true;


    } else {


      status.textContent =

        "目前有 " +

        available.length +

        " 位可以抽";


      goButton.disabled =
        false;

    }

  }



  putBackBtn.disabled =

    lastRound.length === 0 ||

    isDrawing;



  restoreAllBtn.disabled =

    excluded.length === 0 ||

    isDrawing;



  drawWheel();

}



/* =========================
   切換不參與
========================= */

function toggleExcluded(
  number
) {


  if (
    isDrawing
  ) {

    return;

  }



  if (
    drawn.includes(number)
  ) {


    alert(

      number +

      "號已經抽過了，請重新開始後再設定。"

    );


    return;

  }



  const index =

    excluded.indexOf(
      number
    );



  if (
    index === -1
  ) {


    excluded.push(
      number
    );


  } else {


    excluded.splice(
      index,
      1
    );

  }



  resetWheelAngle();


  render();

}



/* =========================
   恢復全員
========================= */

function restoreAll() {


  if (
    isDrawing
  ) {

    return;

  }


  excluded = [];


  resetWheelAngle();


  render();


  status.textContent =
    "已恢復全員參與";

}



/* =========================
   轉一位
========================= */

async function spinOne(
  order
) {


  const numbers =
    getAvailableNumbers();


  if (
    numbers.length === 0
  ) {

    return;

  }



  status.textContent =

    "正在抽第 " +

    order +

    " 位……";



  /* =========================
     隨機轉圈
     不先決定座號
  ========================= */


  const extraTurns =

    6 +

    Math.floor(
      Math.random() * 4
    );


  /*
    隨機停在任意角度
  */

  const randomStopAngle =

    Math.random() * 360;



  const totalRotation =

    extraTurns * 360 +

    randomStopAngle;



  currentRotation +=

    totalRotation;



  /* =========================
     慢慢減速
  ========================= */

  wheel.style.transition =

    `transform ${SPIN_TIME}ms cubic-bezier(0.08, 0.72, 0.08, 1)`;


  requestAnimationFrame(
    () => {


      wheel.style.transform =

        `rotate(${currentRotation}deg)`;

    }
  );



  await sleep(
    SPIN_TIME + 250
  );



  /* =========================
     停下後再辨識座號
  ========================= */


  const finalRotation =

    (
      (
        currentRotation %
        360
      ) +
      360
    ) %
    360;



  /*
    箭頭固定在最上方

    轉盤順時針旋轉後，
    要反推箭頭相對原始轉盤
    指到的角度
  */

  const pointerOffset =

    (
      360 -
      finalRotation
    ) %
    360;



  /*
    每格角度
  */

  const sliceDegrees =

    360 /

    numbers.length;



  /*
    直接判斷所在格

    這裡不加半格，
    因為每格本身就是
    從正上方邊界開始畫
  */

  let selectedIndex =

    Math.floor(

      pointerOffset /

      sliceDegrees

    );



  selectedIndex =

    selectedIndex %

    numbers.length;



  const selected =

    numbers[
      selectedIndex
    ];



  /* =========================
     正式記錄
  ========================= */


  const remainingIndex =

    remaining.indexOf(
      selected
    );



  if (
    remainingIndex !== -1
  ) {


    remaining.splice(
      remainingIndex,
      1
    );

  }



  drawn.push(
    selected
  );


  lastRound.push(
    selected
  );



  /* =========================
     顯示結果
  ========================= */


  const card =

    document.createElement(
      "div"
    );



  card.className =
    "result-card";



  card.innerHTML = `

    <div class="result-order">

      第 ${order} 位

    </div>

    <div class="result-number">

      ${selected}號

    </div>

  `;



  resultBox.appendChild(
    card
  );



  status.textContent =

    `第 ${order} 位：${selected}號`;



  return selected;

}



/* =========================
   開始抽籤
========================= */

async function startDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  const available =
    getAvailableNumbers();



  const amount =

    parseInt(
      drawCount.value
    );



  if (
    available.length === 0
  ) {

    return;

  }



  if (
    amount >
    available.length
  ) {


    alert(

      "目前只有 " +

      available.length +

      " 位可以抽喔！"

    );


    return;

  }



  isDrawing =
    true;


  lastRound =
    [];


  resultBox.innerHTML =
    "";



  goButton.disabled =
    true;


  goButton.classList.add(
    "spinning"
  );


  goButton.textContent =
    "轉";


  drawCount.disabled =
    true;


  putBackBtn.disabled =
    true;


  restoreAllBtn.disabled =
    true;


  renderAbsenceButtons();



  /* =========================
     一位一位抽
  ========================= */


  for (
    let order = 1;
    order <= amount;
    order++
  ) {


    await spinOne(
      order
    );



    if (
      order <
      amount
    ) {


      await sleep(
        BETWEEN_SPINS
      );



      /*
        下一位之前，
        移除剛才抽中的人
        再重畫轉盤
      */

      resetWheelAngle();


      drawWheel();


      await sleep(
        350
      );

    }

  }



  /* =========================
     完成
  ========================= */


  isDrawing =
    false;


  drawCount.disabled =
    false;


  goButton.classList.remove(
    "spinning"
  );


  goButton.textContent =
    "GO";



  /*
    最後結果保留一下
  */

  await sleep(
    600
  );



  resetWheelAngle();


  render();



  status.textContent =

    "本輪完成，共抽出 " +

    amount +

    " 位";

}



/* =========================
   放回上一輪
========================= */

function putBack() {


  if (
    isDrawing ||
    lastRound.length === 0
  ) {

    return;

  }



  lastRound.forEach(
    number => {


      const index =

        drawn.indexOf(
          number
        );



      if (
        index !== -1
      ) {


        drawn.splice(
          index,
          1
        );

      }



      if (
        !remaining.includes(
          number
        )
      ) {


        remaining.push(
          number
        );

      }

    }

  );



  remaining.sort(
    (a,b) =>
      a - b
  );



  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();


  status.textContent =
    "上一輪已放回";

}



/* =========================
   重新開始
   保留今日不參與
========================= */

function resetDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();


  status.textContent =

    "已重新開始，今日不參與設定已保留";

}



/* =========================
   初始化
========================= */

function initialize() {


  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  excluded =
    [];


  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();

}



/* =========================
   按鈕事件
========================= */

goButton.addEventListener(
  "click",
  startDraw
);


putBackBtn.addEventListener(
  "click",
  putBack
);


resetBtn.addEventListener(
  "click",
  resetDraw
);


restoreAllBtn.addEventListener(
  "click",
  restoreAll
);



/* =========================
   啟動
========================= */

initialize();

</script>

</body>
