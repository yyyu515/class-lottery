<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>班級座號轉盤</title>


<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 22px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f6f2ea;

  color: #39342e;

}


.app {

  width: 100%;

  max-width: 1250px;

  display: grid;

  grid-template-columns:
    minmax(0, 1.4fr)
    minmax(300px, 0.6fr);

  gap: 22px;

}


.panel {

  background: #ffffff;

  border: 1px solid #ded7cc;

  border-radius: 24px;

  box-shadow:
    0 8px 28px
    rgba(0,0,0,.06);

}


/* =========================
   左邊
========================= */

.main-panel {

  padding: 27px 30px 28px;

  text-align: center;

}


.title {

  font-size: 32px;

  font-weight: 900;

  margin-bottom: 4px;

}


.subtitle {

  color: #81796d;

  margin-bottom: 16px;

}


.settings {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 11px;

  font-size: 17px;

  font-weight: 800;

}


select {

  padding: 9px 15px;

  border: 1px solid #cec5b8;

  border-radius: 11px;

  background: white;

  color: #39342e;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;

}


/* =========================
   轉盤區
========================= */

.wheel-area {

  position: relative;

  width: min(540px, 90vw);

  aspect-ratio: 1;

  margin:
    18px auto
    10px;

}


.wheel-shadow {

  position: absolute;

  inset: 5%;

  border-radius: 50%;

  box-shadow:
    0 14px 30px
    rgba(0,0,0,.15);

}


#wheel {

  width: 100%;

  height: 100%;

  display: block;

  transform: rotate(0deg);

}


/* =========================
   箭頭
========================= */

.pointer {

  position: absolute;

  left: 50%;

  top: -3px;

  transform:
    translateX(-50%);

  width: 0;

  height: 0;

  border-left:
    24px solid transparent;

  border-right:
    24px solid transparent;

  border-top:
    50px solid #50483e;

  border-bottom: 0;

  z-index: 20;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.20)
    );

}


/* =========================
   GO 按鈕
========================= */

.go-button {

  position: absolute;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 94px;

  height: 94px;

  border-radius: 50%;

  border:
    7px solid
    #5f564b;

  background:
    #fffaf2;

  color:
    #4a433a;

  font-size: 25px;

  font-weight: 900;

  cursor: pointer;

  z-index: 15;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.17);

  transition:
    transform .15s ease,
    background .15s ease;

}


.go-button:hover {

  transform:
    translate(-50%, -50%)
    scale(1.07);

  background:
    #f1e8db;

}


.go-button:active {

  transform:
    translate(-50%, -50%)
    scale(.94);

}


.go-button:disabled {

  cursor: not-allowed;

  opacity: .65;

  transform:
    translate(-50%, -50%);

}


/* 轉動時 GO */

.go-button.spinning {

  animation:
    pulse 1s
    infinite alternate;

}


@keyframes pulse {

  from {

    box-shadow:
      0 5px 15px
      rgba(0,0,0,.17);

  }

  to {

    box-shadow:
      0 5px 24px
      rgba(86,72,55,.35);

  }

}


/* =========================
   結果
========================= */

.result-box {

  min-height: 70px;

  display: flex;

  justify-content: center;

  align-items: center;

  flex-wrap: wrap;

  gap: 10px;

  margin:
    3px 0
    5px;

}


.result-card {

  min-width: 100px;

  padding:
    9px 16px;

  border-radius: 15px;

  background:
    #eee6da;

  border:
    2px solid
    #c9baa6;

  animation:
    pop .45s ease;

}


.result-order {

  color:
    #82776a;

  font-size: 13px;

  font-weight: 800;

}


.result-number {

  margin-top: 2px;

  font-size: 28px;

  font-weight: 900;

}


@keyframes pop {

  0% {

    transform:
      scale(.65);

  }

  65% {

    transform:
      scale(1.13);

  }

  100% {

    transform:
      scale(1);

  }

}


/* =========================
   狀態
========================= */

.status {

  min-height: 27px;

  margin-top: 5px;

  color:
    #71695f;

  font-size: 17px;

  font-weight: 800;

}


.hint {

  margin-top: 6px;

  color:
    #aaa197;

  font-size: 13px;

}


/* =========================
   右邊
========================= */

.side {

  display: flex;

  flex-direction: column;

  gap: 15px;

}


.side-panel {

  padding: 20px;

}


.section-title {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 10px;

  margin-bottom: 13px;

  font-size: 18px;

  font-weight: 900;

}


/* =========================
   座號
========================= */

.number-list {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

}


.number-chip {

  min-width: 50px;

  padding: 9px 10px;

  border-radius: 11px;

  background:
    #f1ede5;

  border:
    1px solid
    #ddd4c7;

  text-align: center;

  font-weight: 800;

}


.number-chip.drawn {

  background:
    #e5e2dc;

  color:
    #99938a;

  text-decoration:
    line-through;

}


/* =========================
   今日不參與
========================= */

.absence-list {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;

}


.absence-btn {

  min-width: 49px;

  padding: 8px 9px;

  border-radius: 10px;

  border:
    1px solid
    #d3cabd;

  background: white;

  color:
    #39342e;

  font-weight: 800;

  cursor: pointer;

}


.absence-btn:hover {

  background:
    #f3eee5;

}


.absence-btn.excluded {

  background:
    #d7d2ca;

  color:
    #77716a;

  text-decoration:
    line-through;

}


.absence-btn:disabled {

  cursor:
    not-allowed;

}


/* =========================
   恢復全員
========================= */

.restore-btn {

  padding:
    7px 10px;

  border:
    1px solid
    #cdc3b5;

  border-radius: 9px;

  background: white;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;

}


.restore-btn:disabled {

  opacity: .4;

  cursor:
    not-allowed;

}


/* =========================
   下方按鈕
========================= */

.actions {

  display: flex;

  gap: 9px;

}


.action-btn {

  flex: 1;

  padding:
    13px 8px;

  border:
    1px solid
    #cdc4b7;

  border-radius: 12px;

  background: white;

  color:
    #39342e;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

}


.action-btn:hover {

  background:
    #f5f1e9;

}


.action-btn:disabled {

  opacity: .4;

  cursor:
    not-allowed;

}


/* =========================
   手機
========================= */

@media
(max-width: 850px) {

  body {

    padding: 12px;

  }


  .app {

    grid-template-columns:
      1fr;

  }


  .main-panel {

    padding:
      22px 15px;

  }


  .title {

    font-size:
      27px;

  }


  .wheel-area {

    width:
      min(
        500px,
        92vw
      );

  }


  .go-button {

    width: 82px;

    height: 82px;

    font-size: 22px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- ======================
     左側
======================= -->

<main class="panel main-panel">


  <div class="title">

    班級座號轉盤

  </div>


  <div class="subtitle">

    1～11 號｜抽過不重複

  </div>


  <div class="settings">

    <span>

      這次要抽

    </span>


    <select id="drawCount">

      <option value="1">
        1 位
      </option>

      <option value="2">
        2 位
      </option>

      <option value="3">
        3 位
      </option>

      <option value="4">
        4 位
      </option>

      <option value="5">
        5 位
      </option>

      <option value="6">
        6 位
      </option>

      <option value="7">
        7 位
      </option>

      <option value="8">
        8 位
      </option>

      <option value="9">
        9 位
      </option>

      <option value="10">
        10 位
      </option>

      <option value="11">
        11 位
      </option>

    </select>

  </div>


  <!-- 轉盤 -->

  <div class="wheel-area">


    <div
      class="wheel-shadow">
    </div>


    <canvas
      id="wheel"
      width="700"
      height="700">
    </canvas>


    <!-- 朝下箭頭 -->

    <div
      class="pointer">
    </div>


    <!-- GO 就是按鈕 -->

    <button
      id="goButton"
      class="go-button"
      type="button">

      GO

    </button>


  </div>


  <!-- 抽籤結果 -->

  <div
    class="result-box"
    id="resultBox">
  </div>


  <div
    class="status"
    id="status">

    目前有 11 位可以抽

  </div>


  <div class="hint">

    點擊中間的 GO 開始轉盤

  </div>


</main>



<!-- ======================
     右側
======================= -->

<aside class="side">


  <!-- 今日不參與 -->

  <section
    class="panel
    side-panel">


    <div
      class="section-title">


      <span>

        今日不參與

      </span>


      <button
        id="restoreAllBtn"
        class="restore-btn"
        type="button">

        恢復全員

      </button>


    </div>


    <div
      id="absenceList"
      class="absence-list">
    </div>


  </section>



  <!-- 尚未抽到 -->

  <section
    class="panel
    side-panel">


    <div
      class="section-title">


      <span>

        尚未抽到

      </span>


      <span
        id="remainingCount">

        11 人

      </span>


    </div>


    <div
      id="remainingList"
      class="number-list">
    </div>


  </section>



  <!-- 已抽過 -->

  <section
    class="panel
    side-panel">


    <div
      class="section-title">


      <span>

        已抽過

      </span>


      <span
        id="drawnCount">

        0 人

      </span>


    </div>


    <div
      id="drawnList"
      class="number-list">

      尚未有人被抽到

    </div>


  </section>



  <!-- 操作 -->

  <div class="actions">


    <button
      id="putBackBtn"
      class="action-btn"
      disabled>

      ↩ 放回上一輪

    </button>


    <button
      id="resetBtn"
      class="action-btn">

      🔄 重新開始

    </button>


  </div>


</aside>


</div>



<script>

/* =========================
   基本設定
========================= */

const TOTAL = 11;


/*
  每一次轉盤時間

  8500 = 8.5 秒

  想更久：
  可以改成 10000
*/

const SPIN_TIME = 8500;


/*
  抽多人時，
  每一位中間停多久
*/

const BETWEEN_SPINS = 1500;



let remaining = [];

let drawn = [];

let excluded = [];

let lastRound = [];

let currentRotation = 0;

let isDrawing = false;



/* =========================
   元素
========================= */

const wheel =
  document.getElementById(
    "wheel"
  );


const ctx =
  wheel.getContext(
    "2d"
  );


const goButton =
  document.getElementById(
    "goButton"
  );


const drawCount =
  document.getElementById(
    "drawCount"
  );


const resetBtn =
  document.getElementById(
    "resetBtn"
  );


const putBackBtn =
  document.getElementById(
    "putBackBtn"
  );


const restoreAllBtn =
  document.getElementById(
    "restoreAllBtn"
  );


const absenceList =
  document.getElementById(
    "absenceList"
  );


const remainingList =
  document.getElementById(
    "remainingList"
  );


const drawnList =
  document.getElementById(
    "drawnList"
  );


const remainingCount =
  document.getElementById(
    "remainingCount"
  );


const drawnCount =
  document.getElementById(
    "drawnCount"
  );


const resultBox =
  document.getElementById(
    "resultBox"
  );


const status =
  document.getElementById(
    "status"
  );



/* =========================
   等待
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}



/* =========================
   可抽的人
========================= */

function getAvailableNumbers() {

  return remaining.filter(

    number =>

      !excluded.includes(
        number
      )

  );

}



/* =========================
   畫轉盤
========================= */

function drawWheel() {


  const numbers =
    getAvailableNumbers();


  const size =
    wheel.width;


  const center =
    size / 2;


  const radius =
    center - 18;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  /* 沒人可以抽 */

  if (
    numbers.length === 0
  ) {


    ctx.beginPath();


    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      "#E8E0D5";


    ctx.fill();


    ctx.fillStyle =
      "#756D63";


    ctx.font =
      "bold 42px Microsoft JhengHei";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    ctx.fillText(
      "無可抽座號",
      center,
      center - 120
    );


    return;

  }



  const slice =
    (
      Math.PI * 2
    ) /
    numbers.length;



  /*
    奶茶三色

    淺米白
    奶茶
    深奶茶
  */

  const colors = [

    "#EDE5D9",

    "#D8CBB9",

    "#C7B59D"

  ];



  numbers.forEach(
    (number, index) => {


      const startAngle =

        -Math.PI / 2 +

        index * slice;



      const endAngle =

        startAngle +

        slice;



      /* 扇形 */

      ctx.beginPath();


      ctx.moveTo(
        center,
        center
      );


      ctx.arc(
        center,
        center,
        radius,
        startAngle,
        endAngle
      );


      ctx.closePath();



      ctx.fillStyle =

        colors[
          index %
          colors.length
        ];


      ctx.fill();



      /* 白色分隔線 */

      ctx.strokeStyle =
        "#FFFDF8";


      ctx.lineWidth =
        4;


      ctx.stroke();



      /* =================
         座號文字
      ================= */


      const middleAngle =

        startAngle +

        slice / 2;



      const textRadius =

        radius * 0.72;



      const x =

        center +

        Math.cos(
          middleAngle
        ) *

        textRadius;



      const y =

        center +

        Math.sin(
          middleAngle
        ) *

        textRadius;



      ctx.save();



      ctx.translate(
        x,
        y
      );



      ctx.rotate(

        middleAngle +

        Math.PI / 2

      );



      ctx.fillStyle =
        "#37322C";



      let fontSize = 46;


      if (
        numbers.length >= 9
      ) {

        fontSize = 39;

      }



      ctx.font =

        `900 ${fontSize}px Microsoft JhengHei`;



      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";



      ctx.fillText(
        number + "號",
        0,
        0
      );



      ctx.restore();

    }

  );



  /* 外框 */

  ctx.beginPath();


  ctx.arc(
    center,
    center,
    radius,
    0,
    Math.PI * 2
  );


  ctx.strokeStyle =
    "#5D554A";


  ctx.lineWidth =
    10;


  ctx.stroke();

}



/* =========================
   重設角度
========================= */

function resetWheelAngle() {


  wheel.style.transition =
    "none";


  currentRotation = 0;


  wheel.style.transform =
    "rotate(0deg)";


  /*
    強制瀏覽器更新
  */

  void wheel.offsetWidth;

}



/* =========================
   今日不參與按鈕
========================= */

function renderAbsenceButtons() {


  absenceList.innerHTML =
    "";


  for (
    let number = 1;
    number <= TOTAL;
    number++
  ) {


    const button =

      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "absence-btn";


    button.textContent =
      number + "號";


    if (
      excluded.includes(
        number
      )
    ) {


      button.classList.add(
        "excluded"
      );

    }



    button.disabled =
      isDrawing;



    button.addEventListener(

      "click",

      () =>
        toggleExcluded(
          number
        )

    );


    absenceList.appendChild(
      button
    );

  }

}



/* =========================
   更新畫面
========================= */

function render() {


  renderAbsenceButtons();


  const available =
    getAvailableNumbers();



  /* 尚未抽到 */

  remainingList.innerHTML =
    "";


  available.forEach(
    number => {


      const chip =

        document.createElement(
          "div"
        );


      chip.className =
        "number-chip";


      chip.textContent =
        number + "號";


      remainingList.appendChild(
        chip
      );

    }

  );



  /* 已抽過 */

  drawnList.innerHTML =
    "";


  if (
    drawn.length === 0
  ) {


    drawnList.textContent =
      "尚未有人被抽到";


  } else {


    drawn.forEach(
      number => {


        const chip =

          document.createElement(
            "div"
          );


        chip.className =
          "number-chip drawn";


        chip.textContent =
          number + "號";


        drawnList.appendChild(
          chip
        );

      }

    );

  }



  remainingCount.textContent =

    available.length +

    " 人";



  drawnCount.textContent =

    drawn.length +

    " 人";



  if (
    !isDrawing
  ) {


    if (
      available.length === 0
    ) {


      status.textContent =
        "目前沒有可抽的座號";


      goButton.disabled =
        true;


    } else {


      status.textContent =

        "目前有 " +

        available.length +

        " 位可以抽";


      goButton.disabled =
        false;

    }

  }



  putBackBtn.disabled =

    lastRound.length === 0 ||

    isDrawing;



  restoreAllBtn.disabled =

    excluded.length === 0 ||

    isDrawing;



  drawWheel();

}



/* =========================
   不參與
========================= */

function toggleExcluded(
  number
) {


  if (
    isDrawing
  ) {

    return;

  }



  if (
    drawn.includes(
      number
    )
  ) {


    alert(

      number +

      "號已經抽過了，請重新開始後再設定。"

    );


    return;

  }



  const index =

    excluded.indexOf(
      number
    );



  if (
    index === -1
  ) {


    excluded.push(
      number
    );


  } else {


    excluded.splice(
      index,
      1
    );

  }



  resetWheelAngle();


  render();

}



/* =========================
   恢復全員
========================= */

function restoreAll() {


  if (
    isDrawing
  ) {

    return;

  }


  excluded = [];


  resetWheelAngle();


  render();


  status.textContent =
    "已恢復全員參與";

}



/* =========================
   轉一位
========================= */

async function spinOne(
  order
) {


  const numbers =
    getAvailableNumbers();



  /* 隨機決定結果 */

  const selectedIndex =

    Math.floor(

      Math.random() *

      numbers.length

    );



  const selected =

    numbers[
      selectedIndex
    ];



  const sliceDegrees =

    360 /

    numbers.length;



  /*
    每一格的中心
  */

  const targetCenter =

    (
      selectedIndex +
      0.5
    ) *

    sliceDegrees;



  /*
    要把該格中心
    轉到最上方箭頭
  */

  const desiredRotation =

    360 -

    targetCenter;



  const currentMod =

    (
      (
        currentRotation %
        360
      ) +
      360
    ) %
    360;



  const desiredMod =

    (
      (
        desiredRotation %
        360
      ) +
      360
    ) %
    360;



  const extra =

    (
      desiredMod -
      currentMod +
      360
    ) %
    360;



  /*
    多轉 7 圈

    2520 = 360 × 7
  */

  currentRotation =

    currentRotation +

    2520 +

    extra;



  status.textContent =

    "正在抽第 " +

    order +

    " 位……";



  /*
    重點：
    cubic-bezier 讓前面快速，
    後面非常緩慢地停下來。
  */

  wheel.style.transition =

    `transform ${SPIN_TIME}ms cubic-bezier(0.12, 0.72, 0.08, 1)`;


  /*
    下一個畫面更新後
    才開始轉
  */

  requestAnimationFrame(
    () => {


      wheel.style.transform =

        `rotate(${currentRotation}deg)`;

    }
  );



  await sleep(
    SPIN_TIME + 200
  );



  /* =================
     正式抽中
  ================= */


  const remainingIndex =

    remaining.indexOf(
      selected
    );



  if (
    remainingIndex !== -1
  ) {


    remaining.splice(
      remainingIndex,
      1
    );

  }



  drawn.push(
    selected
  );


  lastRound.push(
    selected
  );



  /* 顯示結果 */

  const card =

    document.createElement(
      "div"
    );



  card.className =
    "result-card";



  card.innerHTML = `

    <div class="result-order">

      第 ${order} 位

    </div>

    <div class="result-number">

      ${selected}號

    </div>

  `;



  resultBox.appendChild(
    card
  );



  status.textContent =

    `第 ${order} 位：${selected}號`;



  return selected;

}



/* =========================
   開始抽籤
========================= */

async function startDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  const available =
    getAvailableNumbers();



  const amount =

    parseInt(
      drawCount.value
    );



  if (
    available.length === 0
  ) {

    return;

  }



  if (
    amount >
    available.length
  ) {


    alert(

      "目前只有 " +

      available.length +

      " 位可以抽喔！"

    );


    return;

  }



  isDrawing =
    true;


  lastRound =
    [];


  resultBox.innerHTML =
    "";



  goButton.disabled =
    true;


  goButton.classList.add(
    "spinning"
  );


  goButton.textContent =
    "轉";


  drawCount.disabled =
    true;


  putBackBtn.disabled =
    true;


  restoreAllBtn.disabled =
    true;


  renderAbsenceButtons();



  /* =================
     一位一位抽
  ================= */


  for (
    let order = 1;
    order <= amount;
    order++
  ) {


    await spinOne(
      order
    );



    if (
      order <
      amount
    ) {


      /*
        先讓學生看到結果
      */

      await sleep(
        BETWEEN_SPINS
      );



      /*
        下一位重新畫轉盤
        剛抽中的人消失
      */

      resetWheelAngle();


      drawWheel();


      await sleep(
        400
      );

    }

  }



  /* =================
     全部完成
  ================= */


  isDrawing =
    false;


  drawCount.disabled =
    false;


  goButton.classList.remove(
    "spinning"
  );


  goButton.textContent =
    "GO";



  /*
    稍微保留最後結果，
    再更新轉盤
  */

  await sleep(
    700
  );


  resetWheelAngle();


  render();



  status.textContent =

    "本輪完成，共抽出 " +

    amount +

    " 位";

}



/* =========================
   放回上一輪
========================= */

function putBack() {


  if (
    isDrawing ||
    lastRound.length === 0
  ) {

    return;

  }



  lastRound.forEach(
    number => {


      const index =

        drawn.indexOf(
          number
        );



      if (
        index !== -1
      ) {


        drawn.splice(
          index,
          1
        );

      }



      if (
        !remaining.includes(
          number
        )
      ) {


        remaining.push(
          number
        );

      }

    }

  );



  remaining.sort(
    (a,b) =>
      a - b
  );



  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();


  status.textContent =
    "上一輪已放回";

}



/* =========================
   重新開始
   保留今日不參與
========================= */

function resetDraw() {


  if (
    isDrawing
  ) {

    return;

  }



  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();


  status.textContent =

    "已重新開始，今日不參與設定已保留";

}



/* =========================
   初始化
========================= */

function initialize() {


  remaining =
    [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {


    remaining.push(
      i
    );

  }



  drawn =
    [];


  excluded =
    [];


  lastRound =
    [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();


  render();

}



/* =========================
   按鈕事件
========================= */

/*
  點 GO 就開始
*/

goButton.addEventListener(
  "click",
  startDraw
);


putBackBtn.addEventListener(
  "click",
  putBack
);


resetBtn.addEventListener(
  "click",
  resetDraw
);


restoreAllBtn.addEventListener(
  "click",
  restoreAll
);



/* 啟動 */

initialize();


</script>
