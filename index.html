<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>班級座號抽籤</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f6f3ec;
      color: #3e3a35;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 1100px;

      display: grid;
      grid-template-columns: 1.2fr 0.8fr;

      gap: 24px;
    }

    .panel {
      background: #ffffff;

      border: 1px solid #ddd7cc;
      border-radius: 24px;

      padding: 28px;

      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }

    .main-panel {
      text-align: center;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #7a746b;
      margin-bottom: 22px;
    }

    /* 抽幾位 */

    .draw-settings {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      font-size: 17px;
      font-weight: 700;
    }

    select {
      font-size: 17px;
      padding: 10px 14px;

      border: 1px solid #cfc7bb;
      border-radius: 10px;

      background: white;
      color: #3e3a35;

      cursor: pointer;
    }

    /* 抽籤結果區 */

    .result-area {
      min-height: 240px;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 18px;

      padding: 15px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .result-order {
      font-size: 17px;
      font-weight: 800;
      color: #756957;
    }

    .number-circle {
      width: 125px;
      height: 125px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eee8dc;

      border: 5px solid #c6baa6;

      font-size: 56px;
      font-weight: 900;

      animation: pop 0.35s ease;
    }

    .question {
      width: 200px;
      height: 200px;

      font-size: 90px;
    }

    @keyframes pop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* 抽籤按鈕 */

    .draw-btn {
      width: 100%;

      border: none;
      border-radius: 16px;

      padding: 18px;

      margin-top: 10px;

      font-size: 23px;
      font-weight: 800;

      background: #756957;
      color: white;

      cursor: pointer;
    }

    .draw-btn:hover {
      opacity: 0.9;
    }

    .draw-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;

      font-size: 16px;
      color: #777168;
    }

    .hint {
      margin-top: 18px;

      text-align: center;

      font-size: 13px;
      color: #999289;
    }

    /* 右側 */

    .side {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 14px;

      font-size: 18px;
      font-weight: 800;
    }

    .number-list {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;
    }

    .number-chip {
      min-width: 54px;

      padding: 10px 12px;

      border-radius: 12px;

      text-align: center;

      font-weight: 800;

      background: #f1ede5;

      border: 1px solid #ded6c9;
    }

    .number-chip.drawn {
      background: #e6e3dd;
      color: #99948d;

      text-decoration: line-through;
    }

    /* 底部按鈕 */

    .actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;

      padding: 13px;

      border: 1px solid #cfc7bb;
      border-radius: 12px;

      background: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    .action-btn:hover {
      background: #f5f1ea;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 手機 */

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .result-area {
        min-height: 190px;
      }

      .number-circle {
        width: 105px;
        height: 105px;

        font-size: 46px;
      }

      .question {
        width: 160px;
        height: 160px;

        font-size: 70px;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 左側主抽籤區 -->

  <section class="panel main-panel">

    <div class="title">
      班級座號抽籤
    </div>

    <div class="subtitle">
      1～11 號｜抽過不重複
    </div>

    <div class="draw-settings">

      <label for="drawCount">
        這次要抽
      </label>

      <select id="drawCount">
        <option value="1">1 位</option>
        <option value="2">2 位</option>
        <option value="3">3 位</option>
        <option value="4">4 位</option>
        <option value="5">5 位</option>
        <option value="6">6 位</option>
        <option value="7">7 位</option>
        <option value="8">8 位</option>
        <option value="9">9 位</option>
        <option value="10">10 位</option>
        <option value="11">11 位</option>
      </select>

    </div>

    <div class="result-area" id="resultArea">

      <div class="number-circle question">
        ？
      </div>

    </div>

    <button class="draw-btn" id="drawBtn">
      🎲 開始抽籤
    </button>

    <div class="status" id="status">
      目前有 11 位可以抽
    </div>

    <div class="hint">
      抽出的先後順序，就是實際使用順序
    </div>

  </section>

  <!-- 右側 -->

  <div class="side">

    <section class="panel">

      <div class="section-title">

        <span>
          尚未抽到
        </span>

        <span id="remainingCount">
          11 人
        </span>

      </div>

      <div
        class="number-list"
        id="remainingList">
      </div>

    </section>

    <section class="panel">

      <div class="section-title">

        <span>
          已抽過
        </span>

        <span id="drawnCount">
          0 人
        </span>

      </div>

      <div
        class="number-list"
        id="drawnList">

        尚未有人被抽到

      </div>

    </section>

    <div class="actions">

      <button
        class="action-btn"
        id="putBackBtn"
        disabled>

        ↩ 放回上一輪

      </button>

      <button
        class="action-btn"
        id="resetBtn">

        🔄 重新開始

      </button>

    </div>

  </div>

</div>

<script>

const TOTAL = 11;

let remaining = [];
let drawn = [];
let lastRound = [];

let isDrawing = false;

const resultArea =
  document.getElementById("resultArea");

const drawBtn =
  document.getElementById("drawBtn");

const resetBtn =
  document.getElementById("resetBtn");

const putBackBtn =
  document.getElementById("putBackBtn");

const drawCount =
  document.getElementById("drawCount");

const remainingList =
  document.getElementById("remainingList");

const drawnList =
  document.getElementById("drawnList");

const remainingCount =
  document.getElementById("remainingCount");

const drawnCount =
  document.getElementById("drawnCount");

const status =
  document.getElementById("status");


/* 初始化 */

function initialize() {

  remaining = [];

  for (let i = 1; i <= TOTAL; i++) {
    remaining.push(i);
  }

  drawn = [];
  lastRound = [];

  resultArea.innerHTML = `
    <div class="number-circle question">
      ？
    </div>
  `;

  render();
}


/* 更新畫面 */

function render() {

  remainingList.innerHTML = "";

  remaining.forEach(number => {

    const chip =
      document.createElement("div");

    chip.className =
      "number-chip";

    chip.textContent =
      number + "號";

    remainingList.appendChild(chip);

  });


  drawnList.innerHTML = "";

  if (drawn.length === 0) {

    drawnList.textContent =
      "尚未有人被抽到";

  } else {

    drawn.forEach(number => {

      const chip =
        document.createElement("div");

      chip.className =
        "number-chip drawn";

      chip.textContent =
        number + "號";

      drawnList.appendChild(chip);

    });

  }


  remainingCount.textContent =
    remaining.length + " 人";

  drawnCount.textContent =
    drawn.length + " 人";


  if (remaining.length === 0) {

    status.textContent =
      "全部 11 位都抽過囉！";

    drawBtn.disabled = true;

  } else {

    status.textContent =
      "目前有 " +
      remaining.length +
      " 位可以抽";

    drawBtn.disabled =
      isDrawing;

  }


  putBackBtn.disabled =
    lastRound.length === 0 ||
    isDrawing;
}


/* 開始抽籤 */

function drawNumbers() {

  if (
    remaining.length === 0 ||
    isDrawing
  ) {
    return;
  }


  const amount =
    parseInt(drawCount.value);


  if (amount > remaining.length) {

    alert(
      "目前只剩下 " +
      remaining.length +
      " 位尚未抽到喔！"
    );

    return;
  }


  isDrawing = true;

  drawBtn.disabled = true;
  putBackBtn.disabled = true;
  drawCount.disabled = true;


  let animationCount = 0;


  const animation =
    setInterval(() => {

      resultArea.innerHTML = "";

      let preview =
        [...remaining];

      preview.sort(
        () => Math.random() - 0.5
      );


      preview
        .slice(0, amount)
        .forEach((number, index) => {

          const item =
            document.createElement("div");

          item.className =
            "result-item";


          const order =
            document.createElement("div");

          order.className =
            "result-order";

          order.textContent =
            "第 " + (index + 1) + " 位";


          const circle =
            document.createElement("div");

          circle.className =
            "number-circle";

          circle.textContent =
            number;


          item.appendChild(order);
          item.appendChild(circle);

          resultArea.appendChild(item);

        });


      animationCount++;


      if (animationCount >= 18) {

        clearInterval(animation);

        finishDraw(amount);

      }

    }, 70);
}


/* 正式決定結果 */

function finishDraw(amount) {

  lastRound = [];


  for (let i = 0; i < amount; i++) {

    const randomIndex =
      Math.floor(
        Math.random() *
        remaining.length
      );


    const selected =
      remaining.splice(
        randomIndex,
        1
      )[0];


    lastRound.push(selected);

    drawn.push(selected);

  }


  resultArea.innerHTML = "";


  lastRound.forEach((number, index) => {

    const item =
      document.createElement("div");

    item.className =
      "result-item";


    const order =
      document.createElement("div");

    order.className =
      "result-order";

    order.textContent =
      "第 " + (index + 1) + " 位";


    const circle =
      document.createElement("div");

    circle.className =
      "number-circle";

    circle.textContent =
      number;


    item.appendChild(order);
    item.appendChild(circle);

    resultArea.appendChild(item);

  });


  isDrawing = false;

  drawCount.disabled = false;

  render();
}


/* 放回上一輪 */

function putBack() {

  if (
    lastRound.length === 0 ||
    isDrawing
  ) {
    return;
  }


  lastRound.forEach(number => {

    const index =
      drawn.indexOf(number);

    if (index !== -1) {
      drawn.splice(index, 1);
    }

    remaining.push(number);

  });


  remaining.sort(
    (a, b) => a - b
  );


  lastRound = [];


  resultArea.innerHTML = `
    <div class="number-circle question">
      ？
    </div>
  `;


  render();
}


/* 按鈕 */

drawBtn.addEventListener(
  "click",
  drawNumbers
);

resetBtn.addEventListener(
  "click",
  initialize
);

putBackBtn.addEventListener(
  "click",
  putBack
);


/* 啟動 */

initialize();

</script>

</body>
</html>
