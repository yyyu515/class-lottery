<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>班級座號轉盤抽籤</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  background: #f5f1e8;
  color: #39352f;
}

.app {
  width: 100%;
  max-width: 1250px;

  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.6fr);
  gap: 22px;
}

.panel {
  background: white;
  border: 1px solid #ded8cc;
  border-radius: 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.main-panel {
  padding: 26px 30px 30px;
  text-align: center;
}

.title {
  font-size: 31px;
  font-weight: 900;
  margin-bottom: 4px;
}

.subtitle {
  color: #81796d;
  margin-bottom: 15px;
}

.settings {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;

  gap: 10px;

  font-size: 17px;
  font-weight: 800;
}

select {
  border: 1px solid #cfc6b8;
  border-radius: 11px;

  padding: 9px 14px;

  background: white;

  font-size: 16px;
  font-weight: 700;
  color: #39352f;
}

/* =========================
   轉盤
========================= */

.wheel-area {
  position: relative;

  width: min(540px, 90vw);
  aspect-ratio: 1;

  margin: 14px auto 8px;
}

.wheel-shadow {
  position: absolute;
  inset: 5.5%;

  border-radius: 50%;

  box-shadow:
    0 12px 30px rgba(0,0,0,.13);
}

#wheel {
  width: 100%;
  height: 100%;

  display: block;

  transform: rotate(0deg);
  transition:
    transform 5.5s
    cubic-bezier(.12,.72,.08,1);
}

/* 上方指針 */

.pointer {
  position: absolute;

  left: 50%;
  top: 0;

  transform: translateX(-50%);

  width: 0;
  height: 0;

  border-left: 23px solid transparent;
  border-right: 23px solid transparent;
  border-top: 0;
  border-bottom: 48px solid #4f483f;

  z-index: 10;

  filter: drop-shadow(0 3px 2px rgba(0,0,0,.18));
}

/* 中心圓 */

.wheel-center {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  width: 86px;
  height: 86px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #fffdf8;
  border: 8px solid #655d52;

  font-size: 20px;
  font-weight: 900;

  z-index: 8;

  box-shadow: 0 4px 15px rgba(0,0,0,.14);
}

/* =========================
   結果
========================= */

.result-box {
  min-height: 72px;

  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;

  gap: 10px;

  margin: 4px 0 12px;
}

.result-card {
  min-width: 98px;

  padding: 9px 15px;

  border-radius: 15px;

  background: #f0eadf;
  border: 2px solid #c9bdac;

  animation: pop .45s ease;
}

.result-order {
  font-size: 13px;
  color: #82786b;
  font-weight: 800;
}

.result-number {
  font-size: 27px;
  font-weight: 900;
}

@keyframes pop {

  0% {
    transform: scale(.65);
  }

  65% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }

}

/* =========================
   開始按鈕
========================= */

.draw-btn {
  width: 100%;

  padding: 17px;

  border: 0;
  border-radius: 16px;

  background: #655d52;
  color: white;

  font-size: 23px;
  font-weight: 900;

  cursor: pointer;
}

.draw-btn:hover {
  opacity: .92;
}

.draw-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.status {
  margin-top: 13px;

  min-height: 25px;

  color: #756e65;
  font-weight: 700;
}

.hint {
  margin-top: 7px;

  color: #aaa197;
  font-size: 13px;
}

/* =========================
   右側
========================= */

.side {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.side-panel {
  padding: 20px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 13px;

  font-size: 18px;
  font-weight: 900;
}

.number-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.number-chip {
  min-width: 50px;

  padding: 9px 10px;

  border-radius: 11px;

  background: #f1ede5;
  border: 1px solid #ddd4c7;

  text-align: center;
  font-weight: 800;
}

.number-chip.drawn {
  background: #e5e2dc;
  color: #99938a;

  text-decoration: line-through;
}

/* =========================
   今日不參與
========================= */

.absence-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.absence-btn {
  min-width: 49px;

  padding: 8px 9px;

  border-radius: 10px;

  border: 1px solid #d3cabd;
  background: white;

  color: #39352f;
  font-weight: 800;

  cursor: pointer;
}

.absence-btn:hover {
  background: #f3eee5;
}

.absence-btn.excluded {
  background: #d7d2ca;
  color: #77716a;

  text-decoration: line-through;
}

.restore-btn {
  padding: 7px 10px;

  border: 1px solid #cdc3b5;
  border-radius: 9px;

  background: white;

  font-size: 13px;
  font-weight: 800;

  cursor: pointer;
}

.restore-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* =========================
   其他按鈕
========================= */

.actions {
  display: flex;
  gap: 9px;
}

.action-btn {
  flex: 1;

  padding: 13px 8px;

  border: 1px solid #cdc4b7;
  border-radius: 12px;

  background: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}

.action-btn:hover {
  background: #f5f1e9;
}

.action-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

@media (max-width: 850px) {

  body {
    padding: 12px;
  }

  .app {
    grid-template-columns: 1fr;
  }

  .wheel-area {
    width: min(500px, 92vw);
  }

  .main-panel {
    padding: 22px 15px;
  }

  .title {
    font-size: 26px;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- =====================
       左側轉盤
  ====================== -->

  <main class="panel main-panel">

    <div class="title">
      班級座號轉盤
    </div>

    <div class="subtitle">
      1～11 號｜抽過不重複
    </div>


    <div class="settings">

      <span>
        這次要抽
      </span>

      <select id="drawCount">

        <option value="1">1 位</option>
        <option value="2">2 位</option>
        <option value="3">3 位</option>
        <option value="4">4 位</option>
        <option value="5">5 位</option>
        <option value="6">6 位</option>
        <option value="7">7 位</option>
        <option value="8">8 位</option>
        <option value="9">9 位</option>
        <option value="10">10 位</option>
        <option value="11">11 位</option>

      </select>

    </div>


    <div class="wheel-area">

      <div class="wheel-shadow"></div>

      <canvas
        id="wheel"
        width="700"
        height="700">
      </canvas>

      <div class="pointer"></div>

      <div class="wheel-center">
        GO
      </div>

    </div>


    <div
      class="result-box"
      id="resultBox">
    </div>


    <button
      class="draw-btn"
      id="drawBtn">

      🎯 開始轉盤

    </button>


    <div
      class="status"
      id="status">

      目前有 11 位可以抽

    </div>


    <div class="hint">
      多人抽籤會一位一位轉出來
    </div>

  </main>


  <!-- =====================
       右側
  ====================== -->

  <aside class="side">


    <!-- 今日不參與 -->

    <section class="panel side-panel">

      <div class="section-title">

        <span>
          今日不參與
        </span>

        <button
          class="restore-btn"
          id="restoreAllBtn">

          恢復全員

        </button>

      </div>


      <div
        class="absence-list"
        id="absenceList">
      </div>

    </section>


    <!-- 尚未抽到 -->

    <section class="panel side-panel">

      <div class="section-title">

        <span>
          尚未抽到
        </span>

        <span id="remainingCount">
          11 人
        </span>

      </div>


      <div
        class="number-list"
        id="remainingList">
      </div>

    </section>


    <!-- 已抽過 -->

    <section class="panel side-panel">

      <div class="section-title">

        <span>
          已抽過
        </span>

        <span id="drawnCount">
          0 人
        </span>

      </div>


      <div
        class="number-list"
        id="drawnList">

        尚未有人被抽到

      </div>

    </section>


    <div class="actions">

      <button
        class="action-btn"
        id="putBackBtn"
        disabled>

        ↩ 放回上一輪

      </button>

      <button
        class="action-btn"
        id="resetBtn">

        🔄 重新開始

      </button>

    </div>

  </aside>

</div>


<script>

/* =========================
   基本設定
========================= */

const TOTAL = 11;

const SPIN_TIME = 5500;

const BETWEEN_SPINS = 1300;

let remaining = [];

let drawn = [];

let excluded = [];

let lastRound = [];

let currentRotation = 0;

let isDrawing = false;


/* =========================
   DOM
========================= */

const wheel =
  document.getElementById("wheel");

const ctx =
  wheel.getContext("2d");

const drawBtn =
  document.getElementById("drawBtn");

const drawCount =
  document.getElementById("drawCount");

const resetBtn =
  document.getElementById("resetBtn");

const putBackBtn =
  document.getElementById("putBackBtn");

const restoreAllBtn =
  document.getElementById("restoreAllBtn");

const absenceList =
  document.getElementById("absenceList");

const remainingList =
  document.getElementById("remainingList");

const drawnList =
  document.getElementById("drawnList");

const remainingCount =
  document.getElementById("remainingCount");

const drawnCount =
  document.getElementById("drawnCount");

const resultBox =
  document.getElementById("resultBox");

const status =
  document.getElementById("status");


/* =========================
   小工具
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


function getAvailableNumbers() {

  return remaining.filter(
    number =>
      !excluded.includes(number)
  );

}


/* =========================
   畫轉盤
========================= */

function drawWheel() {

  const numbers =
    getAvailableNumbers();


  const size =
    wheel.width;

  const center =
    size / 2;

  const radius =
    center - 18;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  /* 沒有人可以抽 */

  if (
    numbers.length === 0
  ) {

    ctx.beginPath();

    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#e7e2d9";

    ctx.fill();


    ctx.fillStyle =
      "#777168";

    ctx.font =
      "bold 42px Microsoft JhengHei";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      "無可抽座號",
      center,
      center - 120
    );

    return;

  }


  const slice =
    (Math.PI * 2) /
    numbers.length;


  const colors = [

    "#d9c7ad",
    "#c8d0bd",
    "#dbc2b9",
    "#c6cbd4",
    "#e1d3aa",
    "#bfcfc9",
    "#d4c3d1",
    "#cbbda8",
    "#c9d6c0",
    "#dec7ae",
    "#bdcad0"

  ];


  numbers.forEach(
    (number, index) => {


      const startAngle =
        -Math.PI / 2 +
        index * slice;


      const endAngle =
        startAngle +
        slice;


      /* 扇形 */

      ctx.beginPath();

      ctx.moveTo(
        center,
        center
      );

      ctx.arc(
        center,
        center,
        radius,
        startAngle,
        endAngle
      );

      ctx.closePath();


      ctx.fillStyle =
        colors[
          index %
          colors.length
        ];


      ctx.fill();


      ctx.strokeStyle =
        "#fffdf9";

      ctx.lineWidth =
        5;

      ctx.stroke();


      /* 座號 */

      const middleAngle =
        startAngle +
        slice / 2;


      const textRadius =
        radius * 0.72;


      const x =
        center +
        Math.cos(middleAngle) *
        textRadius;


      const y =
        center +
        Math.sin(middleAngle) *
        textRadius;


      ctx.save();


      ctx.translate(
        x,
        y
      );


      /* 讓字保持直立 */

      ctx.rotate(
        middleAngle +
        Math.PI / 2
      );


      ctx.fillStyle =
        "#38342f";


      let fontSize = 46;


      if (
        numbers.length >= 9
      ) {

        fontSize = 39;

      }


      ctx.font =
        `900 ${fontSize}px Microsoft JhengHei`;


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillText(
        number + "號",
        0,
        0
      );


      ctx.restore();

    }
  );


  /* 外框 */

  ctx.beginPath();

  ctx.arc(
    center,
    center,
    radius,
    0,
    Math.PI * 2
  );

  ctx.strokeStyle =
    "#665e53";

  ctx.lineWidth =
    9;

  ctx.stroke();

}


/* =========================
   重置轉盤角度
========================= */

function resetWheelAngle() {

  wheel.style.transition =
    "none";


  currentRotation = 0;


  wheel.style.transform =
    "rotate(0deg)";


  /* 強制瀏覽器套用 */

  void wheel.offsetWidth;


  wheel.style.transition =
    "transform 5.5s cubic-bezier(.12,.72,.08,1)";

}


/* =========================
   畫面更新
========================= */

function renderAbsenceButtons() {

  absenceList.innerHTML =
    "";


  for (
    let number = 1;
    number <= TOTAL;
    number++
  ) {


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "absence-btn";


    button.textContent =
      number + "號";


    if (
      excluded.includes(number)
    ) {

      button.classList.add(
        "excluded"
      );

    }


    button.disabled =
      isDrawing;


    button.addEventListener(
      "click",
      () =>
        toggleExcluded(number)
    );


    absenceList.appendChild(
      button
    );

  }

}


function render() {

  renderAbsenceButtons();


  const available =
    getAvailableNumbers();


  /* 尚未抽到 */

  remainingList.innerHTML =
    "";


  available.forEach(
    number => {


      const chip =
        document.createElement(
          "div"
        );


      chip.className =
        "number-chip";


      chip.textContent =
        number + "號";


      remainingList.appendChild(
        chip
      );

    }
  );


  /* 已抽過 */

  drawnList.innerHTML =
    "";


  if (
    drawn.length === 0
  ) {


    drawnList.textContent =
      "尚未有人被抽到";


  } else {


    drawn.forEach(
      number => {


        const chip =
          document.createElement(
            "div"
          );


        chip.className =
          "number-chip drawn";


        chip.textContent =
          number + "號";


        drawnList.appendChild(
          chip
        );

      }
    );

  }


  remainingCount.textContent =
    available.length +
    " 人";


  drawnCount.textContent =
    drawn.length +
    " 人";


  if (
    !isDrawing
  ) {


    if (
      available.length === 0
    ) {


      status.textContent =
        "目前沒有可抽的座號";


      drawBtn.disabled =
        true;


    } else {


      status.textContent =
        "目前有 " +
        available.length +
        " 位可以抽";


      drawBtn.disabled =
        false;

    }

  }


  putBackBtn.disabled =
    lastRound.length === 0 ||
    isDrawing;


  restoreAllBtn.disabled =
    excluded.length === 0 ||
    isDrawing;


  drawWheel();

}


/* =========================
   今日不參與
========================= */

function toggleExcluded(number) {

  if (isDrawing) {
    return;
  }


  if (
    drawn.includes(number)
  ) {


    alert(
      number +
      "號已經抽過了，請重新開始後再設定。"
    );


    return;

  }


  const index =
    excluded.indexOf(number);


  if (
    index === -1
  ) {


    excluded.push(number);


  } else {


    excluded.splice(
      index,
      1
    );

  }


  resetWheelAngle();

  render();

}


function restoreAll() {

  if (isDrawing) {
    return;
  }


  excluded = [];


  resetWheelAngle();

  render();


  status.textContent =
    "已恢復全員參與";

}


/* =========================
   轉一次
========================= */

async function spinOne(order) {

  const numbers =
    getAvailableNumbers();


  /*
    先決定真正會抽到誰
  */

  const selectedIndex =
    Math.floor(
      Math.random() *
      numbers.length
    );


  const selected =
    numbers[
      selectedIndex
    ];


  /*
    每格角度
  */

  const sliceDegrees =
    360 /
    numbers.length;


  /*
    selectedIndex 那格的中心，
    要剛好轉到最上方指針。

    轉盤本身第一格從最上方開始，
    所以中心是：

    (index + 0.5) * 每格角度
  */

  const desiredRotation =
    360 -
    (
      (
        selectedIndex +
        0.5
      ) *
      sliceDegrees
    );


  const currentMod =
    (
      (
        currentRotation %
        360
      ) +
      360
    ) %
    360;


  const desiredMod =
    (
      (
        desiredRotation %
        360
      ) +
      360
    ) %
    360;


  const extra =
    (
      desiredMod -
      currentMod +
      360
    ) %
    360;


  /*
    多轉 6 圈，再停到正式結果
  */

  currentRotation =
    currentRotation +
    2160 +
    extra;


  status.textContent =
    "正在抽第 " +
    order +
    " 位……";


  wheel.style.transform =
    `rotate(${currentRotation}deg)`;


  /*
    等轉盤停
  */

  await sleep(
    SPIN_TIME + 150
  );


  /*
    正式抽中
  */

  const remainingIndex =
    remaining.indexOf(
      selected
    );


  if (
    remainingIndex !== -1
  ) {

    remaining.splice(
      remainingIndex,
      1
    );

  }


  drawn.push(
    selected
  );


  lastRound.push(
    selected
  );


  /* 顯示結果 */

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "result-card";


  card.innerHTML = `

    <div class="result-order">
      第 ${order} 位
    </div>

    <div class="result-number">
      ${selected}號
    </div>

  `;


  resultBox.appendChild(
    card
  );


  status.textContent =
    `第 ${order} 位：${selected}號`;


  return selected;

}


/* =========================
   開始多人抽籤
========================= */

async function startDraw() {

  if (isDrawing) {
    return;
  }


  const available =
    getAvailableNumbers();


  const amount =
    parseInt(
      drawCount.value
    );


  if (
    amount >
    available.length
  ) {


    alert(
      "目前只有 " +
      available.length +
      " 位可以抽喔！"
    );


    return;

  }


  isDrawing = true;

  lastRound = [];

  resultBox.innerHTML =
    "";


  drawBtn.disabled =
    true;


  drawCount.disabled =
    true;


  putBackBtn.disabled =
    true;


  restoreAllBtn.disabled =
    true;


  renderAbsenceButtons();


  for (
    let i = 1;
    i <= amount;
    i++
  ) {


    await spinOne(i);


    /*
      如果還要繼續抽下一位：
      等一下 → 移除剛剛抽中的人
      → 重畫下一個轉盤
    */

    if (
      i < amount
    ) {


      await sleep(
        BETWEEN_SPINS
      );


      resetWheelAngle();


      drawWheel();


      await sleep(
        250
      );

    }

  }


  isDrawing = false;


  drawCount.disabled =
    false;


  /*
    最後把抽完的人從轉盤移除
  */

  await sleep(500);


  resetWheelAngle();

  render();


  status.textContent =
    "本輪完成，共抽出 " +
    amount +
    " 位";

}


/* =========================
   放回上一輪
========================= */

function putBack() {

  if (
    isDrawing ||
    lastRound.length === 0
  ) {

    return;

  }


  lastRound.forEach(
    number => {


      const index =
        drawn.indexOf(
          number
        );


      if (
        index !== -1
      ) {

        drawn.splice(
          index,
          1
        );

      }


      if (
        !remaining.includes(
          number
        )
      ) {

        remaining.push(
          number
        );

      }

    }
  );


  remaining.sort(
    (a,b) =>
      a - b
  );


  lastRound = [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();

  render();


  status.textContent =
    "上一輪已放回";

}


/* =========================
   重新開始
   保留請假設定
========================= */

function resetDraw() {

  if (isDrawing) {
    return;
  }


  remaining = [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {

    remaining.push(i);

  }


  drawn = [];

  lastRound = [];


  resultBox.innerHTML =
    "";


  resetWheelAngle();

  render();


  status.textContent =
    "已重新開始，今日不參與設定已保留";

}


/* =========================
   初始化
========================= */

function initialize() {

  remaining = [];


  for (
    let i = 1;
    i <= TOTAL;
    i++
  ) {

    remaining.push(i);

  }


  drawn = [];

  excluded = [];

  lastRound = [];

  resultBox.innerHTML =
    "";


  resetWheelAngle();

  render();

}


/* =========================
   按鈕
========================= */

drawBtn.addEventListener(
  "click",
  startDraw
);


putBackBtn.addEventListener(
  "click",
  putBack
);


resetBtn.addEventListener(
  "click",
  resetDraw
);


restoreAllBtn.addEventListener(
  "click",
  restoreAll
);


/* 啟動 */

initialize();

</script>
